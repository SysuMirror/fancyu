<!doctype html>
<html lang="zh-CN" data-ui="campus">
<head>
<meta charset="utf-8"><script src="/auth-image.js?v=1" defer></script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>站内聊天 | FancyU · 中意你</title>
<link rel="stylesheet" href="home.css?v=chat1">
<link rel="stylesheet" href="campus-ui.css?v=20261114a">
<link rel="stylesheet" href="chat.css?v=20261116b">
<script src="auth-session.js?v=20261116a"></script>
<script src="chat.js?v=20261116a" defer></script>
<meta name="description" content="FancyU · 中意你 站内聊天：在双方同意后开始交流。"><!-- brand: icon + theme + share --><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="alternate icon" href="/favicon.ico" sizes="any"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="manifest" href="/manifest.webmanifest"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="中意你"><!-- PWA：可安装 + 离线兜底 + 通知铃铛（脚本自含样式，失败静默） --><script src="/pwa.js?v=1" defer></script><script src="/notifications-badge.js?v=1" defer></script><meta name="theme-color" content="#faf9f5"><meta property="og:type" content="website"><meta property="og:site_name" content="FancyU · 中意你"><meta property="og:title" content="站内聊天 | FancyU · 中意你"><meta property="og:description" content="FancyU · 中意你 站内聊天：在双方同意后开始交流。"><meta property="og:image" content="https://ssemarket.cn:23028/og.png"><meta property="og:url" content="https://ssemarket.cn:23028/chat"><meta name="twitter:card" content="summary_large_image"></head>
<body data-ui="campus" data-page="chat">
<div id="offlineBar" class="offline-bar" role="alert" hidden>连接已断开，正在重连…… 消息会在恢复后自动补收。</div>
<header class="chat-header">
  <a class="brand" href="/">← FancyU · 中意你</a>
  <span id="connection" role="status">连接中</span>
</header>
<main class="chat-layout" id="layout">
  <aside class="room-panel" aria-label="会话列表">
    <h1>我的聊天 <span id="unread" class="unread-total"></span></h1>
    <p class="muted room-hint">双方同意认识后，就可以在这里聊天。</p>
    <div id="rooms"></div>
    <div id="archived" class="archive" hidden></div>
  </aside>
  <section class="conversation" aria-label="聊天会话">
    <div class="conversation-head">
      <button id="backToList" class="back-to-list" type="button" aria-label="返回会话列表">← 会话</button>
      <div class="head-title">
        <h2 id="name">从一句你好开始</h2>
        <p id="mode" class="muted">选择左侧会话</p>
      </div>
      <div class="chat-actions">
        <button id="exchange" type="button" hidden>申请交换联系方式</button>
        <button id="closeRoom" type="button" hidden>结束会话</button>
        <button id="hideRoom" type="button" hidden>隐藏</button>
        <button id="block" type="button" class="danger" hidden>屏蔽</button>
      </div>
    </div>
    <div id="peer" class="peer-card" hidden></div>
    <div id="exchangeStatus" class="exchange-status" hidden></div>
    <p class="chat-notice">保护个人隐私，不轻信转账或外部链接。聊天记录不向后台 AI 开放；举报时管理员可查看被举报消息及前文。</p>
    <div id="messages" role="log" aria-label="消息记录" tabindex="0">
      <p class="empty" id="emptyState">你们的校园故事，从这里开始。</p>
    </div>
    <button id="older" type="button" hidden>查看更早消息</button>
    <form id="composer">
      <label class="sr-only" for="message">消息内容</label>
      <div class="composer-row">
        <button class="icon-button" id="pickImage" type="button" aria-label="发送图片" title="发送图片">🖼️</button>
        <input type="file" id="imageFile" accept="image/jpeg,image/png,image/webp" hidden>
        <textarea id="message" rows="1" maxlength="2000" enterkeyhint="send"
          placeholder="说声你好吧（Enter 发送，Shift+Enter 换行）" disabled></textarea>
        <button class="primary send" id="send" type="submit" disabled>发送</button>
      </div>
      <div class="composer-foot">
        <span id="notice" role="status" aria-live="polite"></span>
        <span id="charCount" class="char-count" hidden></span>
      </div>
    </form>
  </section>
</main>

<dialog id="exchangeDialog" class="page-dialog">
  <form id="exchangeForm" method="dialog">
    <div class="dialog-heading">
      <h2>自愿交换联系方式</h2>
      <button type="button" id="cancelExchange" class="close" aria-label="关闭">×</button>
    </div>
    <p>双方各自填写并同意后，才会互相展示。对方同意前可撤回申请；已经看到的信息无法收回。</p>
    <label for="exchangeChannel">联系方式</label>
    <select id="exchangeChannel">
      <option>微信</option><option>QQ</option><option>小红书</option><option>邮箱</option><option>其他</option>
    </select>
    <label for="wechat" id="wechatLabel">你的微信号</label>
    <input id="wechat" maxlength="100" required autocomplete="off">
    <p class="muted" id="wechatHint">微信号需为 6–32 位字母数字（可含 _ 和 -）。</p>
    <label class="consent"><input id="consent" type="checkbox" required>我同意双方申请后向对方展示我的联系方式。</label>
    <button class="primary" id="confirmExchange" type="submit">确认申请</button>
  </form>
</dialog>

<dialog id="reportDialog" class="page-dialog">
  <form id="reportForm" method="dialog">
    <div class="dialog-heading">
      <h2>举报这条消息</h2>
      <button type="button" id="cancelReport" class="close" aria-label="关闭">×</button>
    </div>
    <p>管理员将能看到被举报消息及其前文。请说明举报原因（2–500 字）。</p>
    <label class="sr-only" for="reportReason">举报原因</label>
    <textarea id="reportReason" rows="4" maxlength="500" required placeholder="例如：涉及诈骗、人身攻击、骚扰……"></textarea>
    <div class="dialog-actions">
      <button type="button" id="dismissReport">取消</button>
      <button class="primary" id="confirmReport" type="submit">提交举报</button>
    </div>
  </form>
</dialog>

<dialog id="confirmDialog" class="page-dialog">
  <form id="confirmForm" method="dialog">
    <div class="dialog-heading">
      <h2 id="confirmTitle">确认操作</h2>
      <button type="button" id="cancelConfirm" class="close" aria-label="关闭">×</button>
    </div>
    <p id="confirmText"></p>
    <div class="dialog-actions">
      <button type="button" id="dismissConfirm">取消</button>
      <button class="primary" id="confirmYes" type="submit">确认</button>
    </div>
  </form>
</dialog>

<div id="toast" class="toast" role="status" hidden></div>
<script defer src="/tabbar.js?v=20261114a"></script>
</body>
</html>
