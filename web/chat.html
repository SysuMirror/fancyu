<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>站内聊天 · FancyU</title><link rel="stylesheet" href="home.css?v=chat1"><link rel="stylesheet" href="chat.css?v=1"><script src="auth-session.js"></script><script src="chat.js?v=1" defer></script></head><body><header class="chat-header"><a class="brand" href="/">← FancyU · 中意你</a><span id="connection" role="status">连接中</span></header><main class="chat-layout"><aside class="room-panel"><h1>我的聊天 <span id="unread"></span></h1><p class="muted">双方同意认识后，就可以在这里聊天。</p><div id="rooms"></div></aside><section class="conversation" aria-label="聊天会话"><div class="conversation-head"><div><h2 id="name">从一句你好开始</h2><p id="mode" class="muted">选择左侧会话</p></div><div class="chat-actions"><button id="exchange" hidden>申请交换微信</button><button id="closeRoom" hidden>结束连接</button><button id="block" hidden>屏蔽</button></div></div><div id="exchangeStatus" class="exchange-status" hidden></div><div class="chat-notice">保护个人隐私，不轻信转账或外部链接。聊天记录不向后台 AI 开放；举报时管理员可查看被举报消息及前文。</div><div id="messages" role="log" aria-label="消息记录" tabindex="0"><p class="empty">你们的校园故事，从这里开始。</p></div><button id="older" hidden>查看更早消息</button><form id="composer"><label class="sr-only" for="message">消息内容</label><textarea id="message" rows="2" maxlength="2000" placeholder="说声你好吧（最多2000字）" disabled></textarea><button class="send" id="send" disabled>发送</button></form><p id="notice" role="status" aria-live="polite"></p></section></main><dialog id="exchangeDialog"><form id="exchangeForm"><div class="dialog-heading"><h2>自愿交换微信</h2><button type="button" id="cancelExchange" class="close" aria-label="关闭">×</button></div><p>双方各自填写并同意后，才会互相展示。对方同意前可撤回申请；已经看到的信息无法收回。</p><label for="wechat">你的微信号</label><input id="wechat" maxlength="32" required pattern="[A-Za-z0-9][A-Za-z0-9_\-]{5,31}" autocomplete="off"><label class="consent"><input id="consent" type="checkbox" required>我同意双方申请后向对方展示我的微信号。</label><button class="send">确认申请</button></form></dialog></body></html>
