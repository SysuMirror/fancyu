[program:sysudate]
command=/home/cloud/sysudate/run.sh
directory=/home/cloud/sysudate/api
autostart=true
autorestart=true
startsecs=3
startretries=5
stopasgroup=true
killasgroup=true
stdout_logfile=/home/cloud/logs/sysudate.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/home/cloud/logs/sysudate.err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
