<body data-ui="campus" data-page="notifications">
<main>
<header><a href="/">← 首页</a><a href="/profile">个人中心</a><a href="/chat" data-chat-link hidden>消息<span data-chat-badge></span></a></header>
<h1>通知中心</h1>
<p class="muted">配对结果、新消息、联系方式变更与截止提醒都会出现在这里。</p>
<section class="card" id="pushCard">
  <h2>系统通知</h2>
  <p class="muted" id="pushState">正在检查…</p>
  <button type="button" id="pushToggle" hidden disabled>开启系统通知</button>
  <p class="muted small">iPhone 需要先把「中意你」添加到主屏（Safari 分享 → 添加到主屏幕），再从主屏图标打开本页才能收到推送。</p>
</section>
<section class="card" id="prefCard">
  <h2>通知偏好</h2>
  <p class="muted small">关掉的类别不会再推送到这台设备，但依然会出现在下面的通知中心里。</p>
  <div id="prefs" class="prefs"><p class="muted">正在读取…</p></div>
</section>
<section class="card">
  <div class="notif-head"><h2>全部通知</h2><button type="button" id="readAll" class="text-button">全部标为已读</button></div>
  <div id="list" aria-live="polite"><p class="muted">正在读取…</p></div>
  <button type="button" id="more" class="retry" hidden>加载更早的通知</button>
</section>
</main>
<div class="toast" id="toast" role="status" hidden></div>
<script defer src="/tabbar.js?v=20261116b"></script>
</body>
