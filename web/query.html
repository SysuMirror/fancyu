<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>查询 · 中意你 | FancyU</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --sysu-green: #1e4a32;
            --sysu-green-light: #2f6a4b;
            --sysu-green-soft: #eef3f0;
            --sysu-border: #d8e8e0;
            --sysu-text: #244735;
            --sysu-sub: #5a7a6a;
            --sysu-bg: linear-gradient(145deg, #c8e0d4 0%, #a8c8b8 100%);
            --card-bg: rgba(255, 255, 255, 0.96);
            --danger-bg: #ffe6e5;
            --danger-text: #b34a3c;
            --empty-color: #8aa89a;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
            background: var(--sysu-bg);
            min-height: 100vh;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            position: relative;
        }
        body::before {
            content: '';
            position: fixed;
            bottom: 0;
            right: 0;
            width: 45%;
            height: 45%;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 350" opacity="0.15"><path fill="none" stroke="%23336644" stroke-width="2.5" d="M80,280 L80,120 L140,70 L260,70 L320,120 L320,280 M140,70 L140,180 L260,180 L260,70 M200,70 L200,120 M120,120 L280,120 M120,160 L280,160 M100,220 L300,220 M100,260 L300,260 M160,120 L160,180 M240,120 L240,180" /><polygon points="200,50 210,65 190,65" fill="%23336644"/><rect x="185" y="220" width="30" height="60" fill="%23336644" opacity="0.6"/><circle cx="200" cy="90" r="12" fill="none" stroke="%23336644" stroke-width="2"/></svg>');
            background-repeat: no-repeat;
            background-size: contain;
            pointer-events: none;
            z-index: 0;
        }
        .container {
            max-width: 920px;
            width: 100%;
            background: var(--card-bg);
            border-radius: 42px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.08);
            padding: 40px 36px;
            position: relative;
            z-index: 1;
            backdrop-filter: blur(2px);
            border: 1px solid rgba(255,255,255,0.6);
        }
        h1 {
            font-family: "Georgia", "Times New Roman", serif;
            font-size: 32px;
            font-weight: 700;
            color: var(--sysu-green);
            margin-bottom: 12px;
            letter-spacing: -0.3px;
        }
        .sub {
            color: var(--sysu-sub);
            margin-bottom: 28px;
            border-left: 4px solid var(--sysu-green);
            padding-left: 18px;
            font-size: 16px;
            line-height: 1.7;
        }
        .input-area {
            display: flex;
            gap: 12px;
            margin-bottom: 28px;
            flex-wrap: wrap;
        }
        .input-area input {
            flex: 1;
            min-width: 240px;
            padding: 14px 20px;
            font-size: 16px;
            border: 1.5px solid #d0e4da;
            border-radius: 48px;
            outline: none;
            transition: all 0.2s;
            font-family: monospace;
            background: white;
        }
        .input-area input:focus {
            border-color: var(--sysu-green);
            box-shadow: 0 0 0 3px rgba(30,74,50,0.1);
        }
        .input-area button {
            padding: 14px 32px;
            background: var(--sysu-green);
            color: white;
            border: none;
            border-radius: 48px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .input-area button:hover {
            background: var(--sysu-green-light);
            transform: translateY(-1px);
        }
        .loading, .empty-state {
            text-align: center;
            padding: 40px 24px;
            color: var(--sysu-sub);
            background: #f8fcf9;
            border-radius: 28px;
            border: 1px dashed var(--sysu-border);
        }
        .error {
            background: var(--danger-bg);
            color: var(--danger-text);
            padding: 14px 20px;
            border-radius: 24px;
            margin-top: 16px;
        }
        .profile-card {
            margin-top: 20px;
            background: white;
            border-radius: 28px;
            overflow: hidden;
            border: 1px solid var(--sysu-border);
        }
        .profile-header {
            background: linear-gradient(135deg, var(--sysu-green) 0%, var(--sysu-green-light) 100%);
            color: white;
            padding: 20px 24px;
        }
        .profile-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 6px;
        }
        .profile-subtitle {
            opacity: 0.9;
            font-size: 14px;
        }
        .card-body {
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .module {
            border-bottom: 1px solid #e2ece6;
            padding-bottom: 16px;
        }
        .module:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }
        .module-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--sysu-green);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .module-content {
            padding-left: 12px;
        }
        .not-shown {
            color: #b2c6bc;
            font-style: italic;
            font-size: 14px;
            padding: 8px 0;
        }
        .field-row {
            display: flex;
            padding: 6px 0;
            gap: 16px;
            flex-wrap: wrap;
            border-bottom: 1px dashed #f0f4f1;
        }
        .field-row:last-child {
            border-bottom: none;
        }
        .field-label {
            width: 110px;
            flex-shrink: 0;
            font-weight: 600;
            color: #3a5a4a;
            font-size: 14px;
        }
        .field-value {
            flex: 1;
            color: #486654;
            font-size: 14px;
            line-height: 1.6;
        }
        .field-value.empty {
            color: #8aa89a;
            font-style: italic;
        }
        .tags-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .tag {
            background: #eef3f0;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
            color: #2c5e46;
        }
        .photos-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }
        .photo-item {
            width: 80px;
            height: 80px;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            border: 1px solid #d0e4da;
        }
        .photo-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .text-content {
            white-space: pre-wrap;
            line-height: 1.7;
        }
        .modal-img {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.88);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            cursor: pointer;
            padding: 20px;
        }
        .modal-img.show { display: flex; }
        .modal-img img {
            max-width: 92%;
            max-height: 92%;
            border-radius: 24px;
        }
        .note {
            margin-top: 24px;
            padding: 14px 20px;
            background: var(--sysu-green-soft);
            border-radius: 24px;
            color: #2c5e46;
            font-size: 13px;
            text-align: center;
            line-height: 1.8;
        }
        @media (max-width: 640px) {
            .container { padding: 28px 20px; border-radius: 28px; }
            h1 { font-size: 26px; }
            .field-label { width: 90px; font-size: 13px; }
            .photo-item { width: 70px; height: 70px; }
        }

        @media (max-width: 480px) {
            .container { padding: 20px 16px; border-radius: 20px; }
            h1 { font-size: 22px; }
            .field-label { width: 100%; margin-bottom: 4px; }
            .field-row { flex-direction: column; align-items: flex-start; }
            .field-value { font-size: 14px; }
            .photo-grid { grid-template-columns: repeat(3, 1fr); gap: 8px; }
            .photo-item { width: 100%; height: auto; aspect-ratio: 1; }
            .photo-item img { width: 100%; height: 100%; }
            .back-link { font-size: 14px; }
        }

        /* ========== 暗色模式 ========== */
        @media (prefers-color-scheme: dark) {
            body { background: #0f1a14; }
            .container { background: #1a2e24; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
            h1 { color: #4ade80; }
            .field-label { color: #a8b8ae; }
            .field-value { color: #e8f0eb; }
            .card { background: #0f1a14; }
            .card h2 { color: #4ade80; }
            .photo-item { background: #0f1a14; }
            .photo-item .placeholder { color: #6a7a70; }
            .back-link { color: #4ade80; }
            .back-link:hover { background: rgba(0, 133, 62, 0.1); }
        }

        /* ========== 减少动画 ========== */
        @media (prefers-reduced-motion: reduce) {
            * { animation: none !important; transition: none !important; }
        }
    </style>
<script src="auth-session.js"></script>
</head>
<body>
<div class="container">
    <div style="margin-bottom: 20px;">
        <a href="index.html" style="text-decoration: none; color: #1e4a32; font-size: 16px; display: inline-flex; align-items: center; gap: 8px;">
            ← 返回首页
        </a>
    </div>
    <h1>🔍 中意你 · 查询心意</h1>
    <div class="sub">查看对方的公开信息。<br>系统会根据对方填写的 “关于展示” 选项自动控制可见内容；若对方未设置，则默认全部公开。</div>
    <div id="resultArea">
        <div class="empty-state">💡 正在加载对方信息...</div>
    </div>
</div>
<div class="modal-img" id="imageModal">
    <img id="modalImage" src="" alt="查看大图">
</div>
<script>
const API_URL = "/api";

// 登录失效时跳转，并保留返回路径。
function requireLogin() {
    if(window.__loginRedirecting)return;
    window.__loginRedirecting=true;
    localStorage.removeItem('token');localStorage.removeItem('user');
    location.replace('login.html?redirect='+encodeURIComponent(location.pathname.split('/').pop()||'index.html'));
}

let authToken = null;
let userAccount = null;

function checkAuth() {
    authToken = localStorage.getItem('token');
    if (!authToken) {
        requireLogin();
        return false;
    }
    const userStr = localStorage.getItem('user');
    if (userStr) {
        userAccount = JSON.parse(userStr);
    }
    return true;
}

function getAuthHeaders() {
    return authToken ? { 'Authorization': 'Bearer ' + authToken } : {};
}

function handleApiResponse(data) {
    if (data.code === 401) {
        localStorage.removeItem('token');
        localStorage.removeItem('user');
        requireLogin();
        return true;
    }
    return false;
}

document.addEventListener('DOMContentLoaded', () => {
    if (checkAuth()) {
        if (targetUserId) {
            queryByUserId(targetUserId);
        } else {
            resultArea.innerHTML = '<div class="error">❌ 缺少用户参数</div>';
        }
    }
});

const MODULES = [
    {
        key: '基础背景',
        icon: '🎓',
        fields: [
            { label: '昵称', field: 'nickname' },
            { label: '性别', field: 'sex' },
            { label: '学校', field: 'school' },
            { label: '年级', field: 'grade' },
            { label: '校区', field: 'campus' },
            { label: '专业', field: 'major' },
            { label: '家乡', field: 'hometown' }
        ]
    },
    {
        key: '个人特质',
        icon: '✨',
        fields: [
            { label: '星座', field: 'constellation' },
            { label: 'MBTI', field: 'mbti' },
            { label: '兴趣爱好', field: 'interests', type: 'array' },
            { label: '自定义兴趣', field: 'interest_custom', type: 'array' }
        ]
    },
    {
        key: '外貌偏好',
        icon: '🌿',
        fields: [
            { label: '身高', field: 'height', suffix: 'cm' },
            { label: '颜值自评', field: 'beauty_self', suffix: '/10' },
            { label: 'BMI体型', field: 'body_type' },
            { label: '健身程度', field: 'fitness_level' }
        ]
    },
    {
        key: '匹配问题',
        icon: '🧩',
        fields: [
            { label: 'Q1 相处模式', field: 'q1_co_dependent' },
            { label: 'Q2 矛盾处理', field: 'q2_conflict' },
            { label: 'Q3 仪式感', field: 'q3_ritual' },
            { label: 'Q4 消费观', field: 'q4_consumption' },
            { label: 'Q5 生活重心', field: 'q5_life_focus' },
            { label: 'Q6 情绪控制', field: 'q6_emotion' },
            { label: 'Q7 保持一致的问题', field: 'agree_topics', type: 'array' }
        ]
    },
    {
        key: '自我描述',
        icon: '🪴',
        fields: [
            { label: '自我描述', field: 'self_description', type: 'text' }
        ]
    },
    {
        key: '理想型',
        icon: '💭',
        fields: [
            { label: '理想型描述', field: 'ideal_description', type: 'text' }
        ]
    },
    {
        key: '照片',
        icon: '📷',
        fields: [
            { label: '个人照片', field: 'photos', type: 'photos' }
        ]
    }
];

const urlParams = new URLSearchParams(window.location.search);
const targetUserId = urlParams.get('userId') || '';
const resultArea = document.getElementById('resultArea');
const imageModal = document.getElementById('imageModal');
const modalImage = document.getElementById('modalImage');

async function queryByUserId(userId) {
    resultArea.innerHTML = '<div class="loading">⏳ 正在查询公开信息...</div>';
    try {
        const res = await fetch(`${API_URL}/?action=queryByUserId&userId=${encodeURIComponent(userId)}`, {
            headers: getAuthHeaders()
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const result = await res.json();
        if (handleApiResponse(result)) return;
        if (result.code !== 200 || !result.data) {
            resultArea.innerHTML = `<div class="error">❌ ${escapeHtml(result.msg || '未找到该用户信息')}</div>`;
            return;
        }
        renderProfile(result.data);
    } catch (err) {
        console.error(err);
        resultArea.innerHTML = '<div class="error">❌ 查询失败，请稍后重试</div>';
    }
}

function parseValue(value) {
    if (value === null || value === undefined || value === '') return null;
    if (Array.isArray(value)) return value;
    if (typeof value === 'object') return value;
    if (typeof value === 'string') {
        const trimmed = value.trim();
        if (!trimmed) return null;
        try {
            const parsed = JSON.parse(trimmed);
            return parsed;
        } catch {
            return trimmed;
        }
    }
    return value;
}

function formatFieldValue(fieldConfig, rawValue) {
    const value = parseValue(rawValue);
    
    // ========== 照片字段判断（增强版） ==========
    const isPhotosField = (fieldConfig.type === 'photos') || (fieldConfig.field === 'photos');
    
    if (isPhotosField) {
        let photos = [];
        if (Array.isArray(value)) {
            photos = value;
        } else if (typeof value === 'string') {
            try {
                const parsed = JSON.parse(value);
                if (Array.isArray(parsed)) photos = parsed;
                else if (typeof parsed === 'string') photos = [parsed];
            } catch {
                if (value && value !== '[]') photos = [value];
            }
        }
        const validPhotos = photos.filter(p => p && typeof p === 'string' && (p.startsWith('data:image') || p.startsWith('/9j/')));
        if (validPhotos.length === 0) return '<span class="empty">未填写</span>';
        return `<div class="photos-grid">${validPhotos.map(src => `<div class="photo-item" onclick="showFullImage('${encodeURIComponent(src)}')"><img src="${escapeHtml(src)}" alt="照片"></div>`).join('')}</div>`;
    }
    // ========== 照片判断结束 ==========
    
    // 空值处理
    if (value === null || value === undefined || value === '') {
        return '<span class="empty">未填写</span>';
    }
    
    // 数组类型（兴趣爱好、标签等）
    if (fieldConfig.type === 'array' || Array.isArray(value)) {
        const arr = Array.isArray(value) ? value : [value];
        const nonEmpty = arr.filter(v => v !== null && v !== undefined && String(v).trim() !== '');
        if (nonEmpty.length === 0) return '<span class="empty">未填写</span>';
        return `<div class="tags-list">${nonEmpty.map(v => `<span class="tag">${escapeHtml(String(v))}</span>`).join('')}</div>`;
    }
    
    // 文本类型（自我描述、理想型）
    if (fieldConfig.type === 'text') {
        const text = String(value).trim();
        if (!text) return '<span class="empty">未填写</span>';
        return `<div class="text-content">${escapeHtml(text).replace(/\n/g, '<br>')}</div>`;
    }
    
    // 普通字段
    let displayValue = String(value);
    if (fieldConfig.suffix && value !== null && value !== '') {
        displayValue = `${value} ${fieldConfig.suffix}`;
    }
    return escapeHtml(displayValue);
}

function renderProfile(data) {
    const displaySelf = parseValue(data.display_self);
    const displaySelfArray = Array.isArray(displaySelf) ? displaySelf : [];

    const nickname = escapeHtml(String(data.nickname || '匿名用户'));

    let modulesHtml = '';

    for (const module of MODULES) {
        // 如果用户选择不展示该模块，直接跳过（不显示"不展示"）
        const isShown = displaySelfArray.length === 0 || displaySelfArray.includes(module.key);
        if (!isShown) continue;

        // 检查该模块是否有任何字段有值
        let moduleHasValue = false;
        let fieldsHtml = '';

        for (const field of module.fields) {
            // 特殊处理：interest_custom 需要和 interests 中的"其他"联动
            if (field.field === 'interest_custom') {
                const interests = parseValue(data['interests']);
                const hasOther = Array.isArray(interests) && interests.includes('其他');
                // 如果没选"其他"，跳过自定义兴趣字段
                if (!hasOther) continue;
            }

            const valueHtml = formatFieldValue(field, data[field.field]);
            // 检查字段是否有值（不是"未填写"）
            if (!valueHtml.includes('class="empty"') && !valueHtml.includes('class="not-shown"')) {
                moduleHasValue = true;
            }

            fieldsHtml += `
                <div class="field-row">
                    <div class="field-label">${field.label}</div>
                    <div class="field-value">${valueHtml}</div>
                </div>
            `;
        }

        // 如果模块没有任何有值的字段，跳过该模块（不显示"未填写"）
        if (!moduleHasValue) continue;

        modulesHtml += `
            <div class="module">
                <div class="module-title">${module.icon} ${module.key}</div>
                <div class="module-content">${fieldsHtml}</div>
            </div>
        `;
    }

    // 如果没有展示任何模块（display_self 为空时展示全部）
    if (!modulesHtml) {
        modulesHtml = '<div class="empty-state">该用户暂未填写任何信息</div>';
    }

    resultArea.innerHTML = `
        <div class="profile-card">
            <div class="profile-header">
                <div class="profile-title">${nickname}</div>
                <div class="profile-subtitle">公开信息</div>
            </div>
            <div class="card-body">
                ${modulesHtml}
            </div>
        </div>
    `;
}

window.showFullImage = function(encodedSrc) {
    const src = decodeURIComponent(encodedSrc);
    modalImage.src = src;
    imageModal.classList.add('show');
};

imageModal.addEventListener('click', () => {
    imageModal.classList.remove('show');
    modalImage.src = '';
});

function escapeHtml(str) {
    return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
}
</script>
</body>
</html>
