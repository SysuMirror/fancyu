<!doctype html><html lang="zh-CN" data-ui="campus"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>问卷管理 · FancyU 管理后台</title><link rel="stylesheet" href="/campus-ui.css?v=20261111b"><script defer src="/admin-survey.js?v=20261112a"></script></head>
<body data-ui="campus" data-page="admin"><main>
<header><a href="/admin">← 管理后台</a><button id="reload">重新载入</button></header>
<h1>问卷管理</h1>
<p class="notice">修改会立即影响用户端问卷与匹配校验。选项文案按原文存储在用户答案里：改动已有选项或删题后，尚未重新保存问卷的用户会暂时退出匹配，直到重新填写。被匹配逻辑依赖的题目（标记 🔒）不能删除或改类型，改选项需勾选「我已了解影响」。</p>
<nav id="kinds" class="stats" aria-label="问卷类型"></nav>
<div id="app" aria-live="polite">正在读取…</div>
<div class="card save-bar"><label class="inline"><input type="checkbox" id="force"> 我已了解影响（改已有选项 / 删题 / 删类型时勾选）</label><button class="primary" id="save">保存并发布新版本</button><span id="ver"></span></div>
</main><div class="toast" id="toast" role="status" hidden></div></body></html>
