<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FancyU · 找回密码</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #00552E 0%, #00853E 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            width: 100%;
            max-width: 400px;
        }
        .logo { text-align: center; margin-bottom: 30px; }
        .logo h1 { color: #00552E; font-size: 28px; margin-bottom: 8px; }
        .logo p { color: #666; font-size: 14px; }
        .form-group { margin-bottom: 20px; }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        .form-group input:focus { outline: none; border-color: #00853E; }
        .code-row { display: flex; gap: 10px; }
        .code-row input { flex: 1; }
        .code-row button {
            padding: 12px 16px;
            background: #f5f5f5;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            white-space: nowrap;
            color: #333;
        }
        .code-row button:hover { background: #e8e8e8; }
        .code-row button:disabled { background: #f0f0f0; color: #999; cursor: not-allowed; }
        .btn {
            width: 100%;
            padding: 14px;
            background: #00853E;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn:hover { background: #006B30; }
        .btn:disabled { background: #ccc; cursor: not-allowed; }
        .links {
            margin-top: 24px;
            text-align: center;
            font-size: 14px;
        }
        .links a { color: #00853E; text-decoration: none; margin: 0 10px; }
        .links a:hover { text-decoration: underline; }
        .msg {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }
        .msg.error { background: #ffebee; color: #c62828; display: block; }
        .msg.success { background: #e8f5e9; color: #2e7d32; display: block; }
        .step { display: none; }
        .step.active { display: block; }
        .step-indicator {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 24px;
        }
        .step-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #e0e0e0;
        }
        .step-dot.active { background: #00853E; }
        .step-dot.done { background: #00853E; }

        /* ========== 平板适配 ========== */
        @media (max-width: 768px) {
            .container { padding: 36px 28px; max-width: 420px; }
            .logo h1 { font-size: 26px; }
        }

        /* ========== 小屏手机 ========== */
        @media (max-width: 480px) {
            body { padding: 12px; }
            .container { padding: 28px 20px; border-radius: 14px; }
            .logo { margin-bottom: 24px; }
            .logo h1 { font-size: 24px; }
            .logo p { font-size: 13px; }
            .step-indicator { margin-bottom: 20px; }
            .step-dot { width: 8px; height: 8px; margin: 0 4px; }
            .form-group { margin-bottom: 16px; }
            .form-group label { font-size: 13px; margin-bottom: 6px; }
            .form-group input { padding: 12px 14px; font-size: 16px; min-height: 48px; }
            .btn { padding: 14px; font-size: 16px; min-height: 52px; }
            .email-row { flex-direction: column !important; gap: 6px !important; }
            .email-row input, .email-row select { width: 100%; min-width: auto; }
            .code-group { flex-direction: column; gap: 8px; }
            .code-group button { width: 100%; padding: 12px; }
            .links { margin-top: 20px; font-size: 13px; }
            .hint { font-size: 11px; }
        }

        /* ========== 超小屏 ========== */
        @media (max-width: 360px) {
            .container { padding: 24px 16px; }
            .logo h1 { font-size: 22px; }
            .form-group input { padding: 10px 12px; }
            .btn { padding: 12px; font-size: 15px; }
        }

        /* ========== 暗色模式 ========== */
        @media (prefers-color-scheme: dark) {
            body { background: linear-gradient(135deg, #001a0f 0%, #00331a 100%); }
            .container { background: #1a2e24; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
            .logo h1 { color: #4ade80; }
            .logo p { color: #a8b8ae; }
            .form-group label { color: #c8d8ce; }
            .form-group input, .form-group select {
                background: #0f1a14;
                border-color: #2a4a3a;
                color: #e8f0eb;
            }
            .form-group input:focus { border-color: #4ade80; }
            .btn { background: #00853E; }
            .btn:hover { background: #006B30; }
            .btn-secondary { background: #555; }
            .btn-secondary:hover { background: #444; }
            .links a { color: #4ade80; }
            .hint { color: #6a7a70; }
            .step-dot { background: #2a4a3a; }
            .step-dot.active { background: #4ade80; }
            .msg.error { background: rgba(220, 53, 69, 0.15); }
            .msg.success { background: rgba(46, 125, 50, 0.15); }
            .code-group button { background: #00552E; }
            .code-group button:disabled { background: #333; }
        }

        /* ========== 减少动画 ========== */
        @media (prefers-reduced-motion: reduce) {
            * { animation: none !important; transition: none !important; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1>FancyU</h1>
            <p>找回密码</p>
        </div>

        <div class="step-indicator">
            <div class="step-dot active" id="dot1"></div>
            <div class="step-dot" id="dot2"></div>
            <div class="step-dot" id="dot3"></div>
        </div>
        
        <div id="msg" class="msg"></div>

        <div class="step active" id="step1">
            <div class="form-group">
                <label for="email">验证邮箱</label>
                <input type="email" id="email" placeholder="注册时使用的学校邮箱" required>
            </div>
            <button type="button" class="btn" id="sendCodeBtn" onclick="sendCode()">发送验证码</button>
        </div>

        <div class="step" id="step2">
            <div class="form-group">
                <label>验证邮箱</label>
                <div id="emailDisplay" style="padding:12px 16px;background:#f5f5f5;border-radius:8px;font-size:14px;color:#333;"></div>
            </div>
            <div class="form-group">
                <label for="code">验证码</label>
                <div class="code-row">
                    <input type="text" id="code" placeholder="6位验证码" maxlength="6">
                    <button id="resendBtn" onclick="sendCode()" disabled>60s</button>
                </div>
            </div>
            <button type="button" class="btn" onclick="goToStep3()">下一步</button>
        </div>

        <div class="step" id="step3">
            <div class="form-group">
                <label for="newPassword">新密码</label>
                <input type="password" id="newPassword" placeholder="至少6位" required>
            </div>
            <div class="form-group">
                <label for="confirmPassword">确认新密码</label>
                <input type="password" id="confirmPassword" placeholder="再次输入新密码" required>
            </div>
            <button type="button" class="btn" id="resetBtn" onclick="resetPassword()">重置密码</button>
        </div>
        
        <div class="links">
            <a href="login.html">返回登录</a>
            <span style="color:#999">|</span>
            <a href="register.html">注册新账号</a>
        </div>
    </div>
    
    <script>
        const API_BASE = '/api';
        let countdownTimer = null;

        function showMsg(text, type) {
            const msg = document.getElementById('msg');
            msg.textContent = text;
            msg.className = 'msg ' + type;
        }

        function goToStep(n) {
            document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
            document.getElementById('step' + n).classList.add('active');
            document.querySelectorAll('.step-dot').forEach((d, i) => {
                d.classList.remove('active', 'done');
                if (i < n - 1) d.classList.add('done');
                if (i === n - 1) d.classList.add('active');
            });
        }

        async function sendCode() {
            const email = document.getElementById('email').value.trim();
            if (!email) {
                showMsg('请输入验证邮箱', 'error');
                return;
            }

            const btn = document.getElementById('sendCodeBtn') || document.getElementById('resendBtn');
            btn.disabled = true;

            try {
                const res = await fetch(API_BASE + '/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'sendCode', email, source: 'reset' })
                });
                const data = await res.json();
                if (data.code === 200) {
                    showMsg('验证码已发送', 'success');
                    document.getElementById('emailDisplay').textContent = email;
                    goToStep(2);
                    startCountdown();
                } else {
                    showMsg(data.msg, 'error');
                    btn.disabled = false;
                }
            } catch (err) {
                showMsg('网络错误', 'error');
                btn.disabled = false;
            }
        }

        function startCountdown() {
            const btn = document.getElementById('resendBtn');
            let seconds = 60;
            btn.disabled = true;
            btn.textContent = seconds + 's';
            if (countdownTimer) clearInterval(countdownTimer);
            countdownTimer = setInterval(() => {
                seconds--;
                btn.textContent = seconds + 's';
                if (seconds <= 0) {
                    clearInterval(countdownTimer);
                    btn.disabled = false;
                    btn.textContent = '重新发送';
                }
            }, 1000);
        }

        function goToStep3() {
            const code = document.getElementById('code').value.trim();
            if (!code || code.length !== 6) {
                showMsg('请输入6位验证码', 'error');
                return;
            }
            showMsg('', '');
            goToStep(3);
        }

        async function resetPassword() {
            const email = document.getElementById('email').value.trim();
            const code = document.getElementById('code').value.trim();
            const newPw = document.getElementById('newPassword').value;
            const confirmPw = document.getElementById('confirmPassword').value;
            const btn = document.getElementById('resetBtn');

            if (!newPw) {
                showMsg('请输入新密码', 'error');
                return;
            }
            if (newPw.length < 6) {
                showMsg('新密码长度不能少于6位', 'error');
                return;
            }
            if (newPw !== confirmPw) {
                showMsg('两次输入的密码不一致', 'error');
                return;
            }

            btn.disabled = true;
            btn.textContent = '重置中...';

            try {
                const res = await fetch(API_BASE + '/account/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, code, new_password: newPw })
                });
                const data = await res.json();
                if (data.code === 200) {
                    showMsg('密码重置成功，即将跳转登录页...', 'success');
                    setTimeout(() => { window.location.href = 'login.html'; }, 2000);
                } else {
                    showMsg(data.msg, 'error');
                }
            } catch (err) {
                showMsg('网络错误', 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = '重置密码';
            }
        }
    </script>
</body>
</html>
