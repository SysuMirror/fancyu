<!DOCTYPE html>
<html lang="zh-CN" data-ui="campus">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>找回密码 | FancyU · 中意你</title>
    <style>

        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            color-scheme: light;
            --sysu-green: #005826;
            --sysu-green-light: #007A33;
            --sysu-green-dark: #003D1A;
            --sysu-green-subtle: #E8F0EB;
            --sysu-red: #A6372D;
            --sysu-red-subtle: #F5ECEB;
            --bg-paper: #FAFAF7;
            --bg-paper-warm: #F7F6F1;
            --bg-card: #FFFFFF;
            --text-primary: #1A2A2E;
            --text-secondary: #4A5A5E;
            --text-muted: #7A8A8E;
            --shadow-soft: 0 4px 20px rgba(0, 88, 38, 0.06), 0 1px 3px rgba(0, 88, 38, 0.04);
            --shadow-card: 0 8px 32px rgba(0, 88, 38, 0.08), 0 2px 8px rgba(0, 88, 38, 0.04);
            --shadow-hover: 0 16px 48px rgba(0, 88, 38, 0.12), 0 4px 12px rgba(0, 88, 38, 0.06);
        }

        body {
            font-family: Inter,"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,-apple-system,sans-serif;
            min-height: 100vh;
            background-color: var(--bg-paper);
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* ========== 背景暗纹装饰 ========== */
        .bg-pattern {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            opacity: 0.02;
        }
        .bg-pattern::before {
            content: '';
            position: absolute;
            top: -100px;
            right: -100px;
            width: 600px;
            height: 600px;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><path fill="%23005826" d="M100,10 Q120,50 160,60 Q130,80 140,120 Q110,100 100,140 Q90,100 60,120 Q70,80 40,60 Q80,50 100,10 Z"/><path fill="%23005826" d="M60,80 Q70,100 90,105 Q75,115 78,135 Q65,120 50,125 Q58,110 45,100 Q62,95 60,80 Z" opacity="0.7"/><path fill="%23005826" d="M140,85 Q150,105 170,110 Q155,120 158,140 Q145,125 130,130 Q138,115 125,105 Q142,100 140,85 Z" opacity="0.7"/></svg>');
            background-repeat: no-repeat;
            background-size: contain;
            transform: rotate(15deg);
        }
        .bg-pattern::after {
            content: '';
            position: absolute;
            bottom: -50px;
            left: -50px;
            width: 500px;
            height: 400px;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 250"><path fill="%23005826" d="M20,230 L20,100 L40,100 L40,70 L60,70 L60,50 L80,50 L80,30 L100,30 L100,50 L120,50 L120,70 L140,70 L140,50 L160,50 L160,30 L180,30 L180,50 L200,50 L200,70 L220,70 L220,50 L240,50 L240,30 L260,30 L260,50 L280,50 L280,230 Z" opacity="0.5"/><rect x="30" y="100" width="40" height="130" fill="%23005826" opacity="0.3"/><rect x="90" y="100" width="40" height="130" fill="%23005826" opacity="0.3"/><rect x="150" y="100" width="40" height="130" fill="%23005826" opacity="0.3"/><rect x="210" y="100" width="40" height="130" fill="%23005826" opacity="0.3"/><rect x="50" y="80" width="200" height="20" fill="%23005826" opacity="0.4"/></svg>');
            background-repeat: no-repeat;
            background-size: contain;
            opacity: 0.5;
        }

        /* ========== 主容器 ========== */
        .container {
            background: var(--bg-card);
            border-radius: 16px;
            box-shadow: var(--shadow-card);
            padding: 48px 40px;
            width: 100%;
            max-width: 420px;
            position: relative;
            z-index: 1;
            border-top: 3px solid var(--sysu-green);
        }

        /* ========== 品牌区域 ========== */
        .logo {
            text-align: center;
            margin-bottom: 36px;
        }
        .brand-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin-bottom: 12px;
        }
        .brand-decoration {
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.7;
        }
        .brand-decoration svg {
            width: 24px;
            height: 24px;
            stroke: var(--sysu-green);
            stroke-width: 1.5;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .logo h1 {
            font-family: "Noto Serif SC","Songti SC","SimSun",serif;
            color: var(--sysu-green);
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 4px;
            white-space: nowrap;
        }
        .logo h1 .sep {
            font-family: system-ui;
            font-weight: 300;
            color: var(--sysu-green-light);
            margin: 0 2px;
            opacity: 0.5;
        }
        .logo p {
            font-family: "Noto Serif SC","Songti SC","SimSun",serif;
            color: var(--text-secondary);
            font-size: 15px;
            letter-spacing: 4px;
            margin-top: 4px;
        }

        /* ========== 表单 ========== */
        .form-group {
            margin-bottom: 22px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-primary);
            font-weight: 500;
            font-size: 14px;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid rgba(0, 88, 38, 0.15);
            border-radius: 10px;
            font-size: 15px;
            font-family: inherit;
            color: var(--text-primary);
            background: var(--bg-paper);
            transition: all 0.3s ease;
        }
        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: var(--sysu-green);
            box-shadow: 0 0 0 3px rgba(0, 88, 38, 0.08);
        }
        .form-group input::placeholder {
            color: var(--text-muted);
        }

        .email-row {
            display: flex;
            align-items: stretch;
            gap: 8px;
        }
        .email-row input {
            flex: 1 1 auto;
            min-width: 0;
            width: auto;
        }
        .email-row .email-at {
            display: flex;
            align-items: center;
            flex: 0 0 auto;
            color: var(--text-secondary);
            font-size: 15px;
            font-weight: 500;
        }
        .email-row select {
            width: auto;
            flex: 0 0 auto;
            cursor: pointer;
        }

        .or-divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: -6px 0 22px;
            color: var(--text-muted);
            font-size: 13px;
            line-height: 1;
        }
        .or-divider::before,
        .or-divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: rgba(0, 88, 38, 0.12);
        }

        /* ========== 邮箱组合 ========== */
        .email-group {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .email-group input {
            flex: 2;
            min-width: 0;
        }
        .email-group .at-sign {
            flex-shrink: 0;
        }
        .email-group select {
            flex: 1;
            min-width: 0;
            max-width: 160px;
            padding: 12px 6px;
            font-size: 13px;
        }
        .email-group .at-sign {
            color: var(--text-muted);
            font-size: 16px;
            font-weight: 500;
        }

        /* ========== 按钮 ========== */
        .btn {
            width: 100%;
            padding: 14px;
            background: var(--sysu-green);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            letter-spacing: 1px;
        }
        .btn:hover {
            background: var(--sysu-green-light);
            box-shadow: 0 4px 16px rgba(0, 88, 38, 0.2);
            transform: translateY(-1px);
        }
        .btn:disabled {
            color: #5f6b66;
            background: #dfe3df;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* ========== 链接区域 ========== */
        .links {
            margin-top: 24px;
            text-align: center;
            font-size: 14px;
        }
        .links a, .links button {
            color: var(--sysu-green);
            text-decoration: none;
            margin: 0 10px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-family: inherit;
            font-weight: 500;
            transition: color 0.2s;
        }
        .links a:hover, .links button:hover {
            color: var(--sysu-green-light);
            text-decoration: underline;
        }

        /* ========== 消息提示 ========== */
        .msg {
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }
        .msg.error {
            background: var(--sysu-red-subtle);
            color: var(--sysu-red);
            display: block;
            border: 1px solid rgba(166, 55, 45, 0.15);
        }
        .msg.success {
            background: var(--sysu-green-subtle);
            color: var(--sysu-green);
            display: block;
            border: 1px solid rgba(0, 88, 38, 0.15);
        }

        /* ========== 分割线 ========== */
        .divider {
            border-top: 1px solid rgba(0, 88, 38, 0.08);
            margin: 28px 0;
        }

        /* ========== 学校标签 ========== */
        .school-tag {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 6px;
            font-size: 12px;
            margin-left: 8px;
            font-weight: 500;
        }
        .school-tag.sysu { background: #e8f5e9; color: #2e7d32; }
        .school-tag.scut { background: #fff3e0; color: #e65100; }
        .school-tag.jnu { background: #e3f2fd; color: #1565c0; }
        .school-tag.scnu { background: #fce4ec; color: #c62828; }
        .school-tag.scau { background: #f3e5f5; color: #7b1fa2; }
        .school-tag.gzhmu { background: #e0f2f1; color: #00695c; }
        .school-tag.gzucm { background: #fff8e1; color: #f57f17; }
        .school-tag.gdut { background: #e8eaf6; color: #283593; }
        .school-tag.gdufs { background: #fce4ec; color: #ad1457; }
        .school-tag.gzhu { background: #e0f7fa; color: #00838f; }
        .school-tag.gdpu { background: #f1f8e9; color: #558b2f; }
        .school-tag.xhcom { background: #ede7f6; color: #4527a0; }
        .school-tag.gzarts { background: #fbe9e7; color: #bf360c; }

        /* ========== 弹窗 ========== */
        .modal-mask {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(6px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            padding: 20px;
        }
        .modal-mask.show {
            display: flex;
        }
        .modal-content {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 36px 32px;
            width: 100%;
            max-width: 440px;
            box-shadow: var(--shadow-hover);
            animation: modalIn 0.3s ease;
            position: relative;
            max-height: 90vh;
            overflow-y: auto;
            border-top: 3px solid var(--sysu-green);
        }
        @keyframes modalIn {
            from { opacity: 0; transform: translateY(24px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .modal-close-btn {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 32px;
            height: 32px;
            border: none;
            background: var(--sysu-green-subtle);
            color: var(--text-muted);
            font-size: 20px;
            cursor: pointer;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .modal-close-btn:hover {
            background: rgba(0, 88, 38, 0.12);
            color: var(--sysu-green);
        }
        .modal-title {
            font-family: "Noto Serif SC","Songti SC","SimSun",serif;
            font-size: 22px;
            color: var(--sysu-green);
            margin-bottom: 28px;
            text-align: center;
            font-weight: 700;
            letter-spacing: 2px;
        }

        /* ========== 验证码输入组 ========== */
        .code-input-group {
            display: flex;
            gap: 12px;
        }
        .send-code-btn {
            padding: 0 18px;
            background: var(--sysu-green);
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            color: white;
            transition: all 0.3s ease;
            font-size: 14px;
            font-family: inherit;
        }
        .send-code-btn:hover:not(:disabled) {
            background: var(--sysu-green-light);
            box-shadow: 0 2px 8px rgba(0, 88, 38, 0.15);
        }
        .send-code-btn:disabled {
            background: #c0c0c0;
            cursor: not-allowed;
        }

        /* ========== 旧版入口 ========== */
        .legacy-note {
            text-align: center;
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 16px;
        }
        .legacy-note a {
            color: var(--text-muted);
            text-decoration: underline;
            transition: color 0.2s;
        }
        .legacy-note a:hover {
            color: var(--sysu-green);
        }

        /* 「|」分隔符：纯装饰，读屏忽略 */
        .sep-dot { color: var(--text-muted); margin: 0 2px; }

        /* ========== 响应式 ========== */
        @media (max-width: 768px) {
            .container { padding: 40px 32px; max-width: 440px; }
            .logo h1 { font-size: 26px; }
            .modal-content { padding: 32px 28px; max-width: 420px; }
        }
        @media (max-width: 480px) {
            body { padding: 12px; }
            .container { padding: 32px 24px; border-radius: 14px; }
            .logo { margin-bottom: 28px; }
            .brand-wrapper { gap: 10px; }
            .brand-decoration svg { width: 18px; height: 18px; }
            .logo h1 { font-size: 24px; letter-spacing: 2px; }
            .logo p { font-size: 13px; }
            .form-group { margin-bottom: 18px; }
            .form-group label { font-size: 13px; margin-bottom: 6px; }
            .form-group input, .form-group select { padding: 12px 14px; font-size: 16px; min-height: 48px; }
            .email-row { gap: 6px; }
            .email-row input { flex: 1 1 auto; min-width: 0; width: auto; }
            .email-row select { flex: 0 1 auto; min-width: 0; width: auto; max-width: 50%; padding: 12px 10px; font-size: 13px; }
            .email-row .email-at { font-size: 14px; }
            .btn { padding: 14px; font-size: 16px; min-height: 52px; }
            .email-group { flex-direction: column; gap: 6px; }
            .email-group .at-sign { display: none; }
            .email-group input, .email-group select { width: 100%; min-width: auto; }
            .links { margin-top: 20px; font-size: 13px; }
            .divider { margin: 20px 0; }
            .modal-content { padding: 28px 20px; margin: 0 12px; max-height: 92vh; }
            .modal-title { font-size: 20px; margin-bottom: 20px; }
            .modal-close-btn { top: 12px; right: 12px; width: 28px; height: 28px; font-size: 18px; }
            .code-input-group { flex-direction: column; gap: 8px; }
            .send-code-btn { padding: 12px 14px; width: 100%; font-size: 14px; }
            .school-tag { font-size: 11px; padding: 2px 6px; }
        }
        @media (max-width: 360px) {
            .container { padding: 28px 18px; }
            .logo h1 { font-size: 22px; letter-spacing: 1px; }
            .brand-decoration { display: none; }
            .form-group input, .form-group select { padding: 10px 12px; }
            .btn { padding: 12px; font-size: 15px; }
        }

        /* ========== 暗色模式 ========== */
        html[data-theme="dark"] {
            color-scheme: dark;
                --bg-paper: #0a1210;
                --bg-paper-warm: #0f1a14;
                --bg-card: #142018;
                --text-primary: #e8f0eb;
                --text-secondary: #a8b8ae;
                --text-muted: #6a7a70;
                --sysu-green-subtle: rgba(0, 88, 38, 0.15);
                --sysu-red-subtle: rgba(166, 55, 45, 0.15);
                --shadow-soft: 0 4px 20px rgba(0, 0, 0, 0.2);
                --shadow-card: 0 8px 32px rgba(0, 0, 0, 0.3);
                --shadow-hover: 0 16px 48px rgba(0, 0, 0, 0.4);
            .form-group input, .form-group select {
                background: var(--bg-paper-warm);
                border-color: rgba(0, 88, 38, 0.25);
                color: var(--text-primary);
            }
            .form-group input:focus, .form-group select:focus {
                border-color: #4ade80;
                box-shadow: 0 0 0 3px rgba(74, 222, 128, 0.1);
            }
            .form-group input::placeholder {
                color: var(--text-muted);
            }
            .btn {
                background: var(--sysu-green-light);
            }
            .btn:disabled {
                color: var(--text-muted);
                background: rgba(255, 255, 255, 0.14);
            }
            .btn:hover {
                background: #00a844;
            }
            .modal-close-btn {
                background: rgba(0, 88, 38, 0.2);
                color: var(--text-muted);
            }
            .modal-close-btn:hover {
                background: rgba(0, 88, 38, 0.3);
                color: #4ade80;
            }
            .send-code-btn {
                background: var(--sysu-green-light);
            }
            .send-code-btn:hover:not(:disabled) {
                background: #00a844;
            }
            .links a, .links button {
                color: #4ade80;
            }
            .links a:hover, .links button:hover {
                color: #6aeea0;
            }
            .legacy-note { color: var(--text-muted); }
            .legacy-note a { color: var(--text-muted); }
            .legacy-note a:hover { color: #4ade80; }
        }

        @media (prefers-reduced-motion: reduce) {
            * { animation: none !important; transition: none !important; }
        }
    
        /* ========== 找回密码：步骤指示器 / 验证码行 ========== */
        .step-indicator {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 24px;
        }
        .step-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(0, 88, 38, 0.12);
            transition: all 0.3s ease;
        }
        .step-dot.active { background: var(--sysu-green); box-shadow: 0 0 0 4px rgba(0, 88, 38, 0.1); }
        .step-dot.done { background: var(--sysu-green-light); }

        .code-row { display: flex; gap: 8px; }
        .code-row input { flex: 1; min-width: 0; }
        .code-row button {
            flex: 0 0 auto;
            min-height: 48px;
            padding: 0 16px;
            font-family: inherit;
            font-size: 14px;
            color: #fff;
            background: var(--sysu-green);
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }
        .code-row button:disabled { color: #5f6b66; background: #dfe3df; cursor: default; }

        .email-display {
            padding: 12px 16px;
            background: var(--bg-paper-warm);
            border: 1.5px solid rgba(0, 88, 38, 0.12);
            border-radius: 10px;
            font-size: 14px;
            color: var(--text-primary);
            word-break: break-all;
        }

        .step {
            display: none;
        }
        .step.active {
            display: block;
            animation: stepIn 0.28s ease;
        }
        @keyframes stepIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: none; }
        }

        /* 「|」分隔符：纯装饰，读屏忽略 */
        .sep-dot { color: var(--text-muted); margin: 0 2px; }

        /* 分步导航：返回上一步（触控高度 ≥44px） */
        .step-nav {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 14px;
        }
        .link-btn {
            background: none;
            border: none;
            padding: 8px 4px;
            min-height: 44px;
            font-family: inherit;
            font-size: 14px;
            color: var(--text-secondary);
            text-decoration: underline;
            text-underline-offset: 3px;
            cursor: pointer;
        }
        .link-btn:hover { color: var(--sysu-green); }
        .link-btn:disabled { color: var(--text-muted); text-decoration: none; cursor: default; }

</style>

    <div class="bg-pattern"></div>

    <div class="container">
    <a class="campus-home-link" href="/">← FancyU · 中意你</a>
        <div class="logo">
            <div class="brand-wrapper">
                <span class="brand-decoration"><svg viewBox="0 0 24 24"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.5 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></svg></span>
                <h1>FancyU<span class="sep">｜</span>中意你</h1>
                <span class="brand-decoration"><svg viewBox="0 0 24 24"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.5 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></svg></span>
            </div>
            <p>找回密码</p>
        </div>

        <div class="step-indicator">
            <div class="step-dot active" id="dot1"></div>
            <div class="step-dot" id="dot2"></div>
            <div class="step-dot" id="dot3"></div>
        </div>
        
        <div id="msg" class="msg"></div>

        <div class="step active" id="step1">
            <div class="form-group">
                <label for="email">验证邮箱</label>
                <input type="email" id="email" placeholder="注册时使用的学校邮箱" autocomplete="email" required>
            </div>
            <button type="button" class="btn" id="sendCodeBtn" onclick="sendCode()">发送验证码</button>
        </div>

        <div class="step" id="step2">
            <div class="form-group">
                <label>验证邮箱</label>
                <div id="emailDisplay" class="email-display"></div>
            </div>
            <div class="form-group">
                <label for="code">验证码</label>
                <div class="code-row">
                    <input type="text" id="code" placeholder="6位验证码" maxlength="6" inputmode="numeric" autocomplete="one-time-code">
                    <button id="resendBtn" onclick="sendCode()" disabled>60s</button>
                </div>
            </div>
            <button type="button" class="btn" onclick="goToStep3()">下一步</button>
            <div class="step-nav">
                <button type="button" class="link-btn" id="backToStep1">← 修改邮箱</button>
            </div>
        </div>

        <div class="step" id="step3">
            <div class="form-group">
                <label for="newPassword">新密码</label>
                <input type="password" id="newPassword" placeholder="至少8位" autocomplete="new-password" minlength="8" required>
            </div>
            <div class="form-group">
                <label for="confirmPassword">确认新密码</label>
                <input type="password" id="confirmPassword" placeholder="再次输入新密码" autocomplete="new-password" required>
            </div>
            <button type="button" class="btn" id="resetBtn" onclick="resetPassword()">重置密码</button>
            <div class="step-nav">
                <button type="button" class="link-btn" id="backToStep2">← 上一步</button>
            </div>
        </div>
        
        <div class="links">
            <a href="/login">返回登录</a>
            <span class="sep-dot" aria-hidden="true">|</span>
            <a href="/register">注册新账号</a>
        </div>
    </div>
    
    <script>
        const API_BASE = '/api';
        let countdownTimer = null;

        document.getElementById('backToStep1').addEventListener('click', () => { showMsg('', ''); goToStep(1); });
        document.getElementById('backToStep2').addEventListener('click', () => { showMsg('', ''); goToStep(2); });

        function showMsg(text, type) {
            const msg = document.getElementById('msg');
            msg.textContent = text;
            msg.className = 'msg ' + type;
        }

        function goToStep(n) {
            document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
            document.getElementById('step' + n).classList.add('active');
            document.querySelectorAll('.step-dot').forEach((d, i) => {
                d.classList.remove('active', 'done');
                if (i < n - 1) d.classList.add('done');
                if (i === n - 1) d.classList.add('active');
            });
        }

        async function sendCode() {
            const email = document.getElementById('email').value.trim();
            if (!email) {
                showMsg('请输入验证邮箱', 'error');
                return;
            }

            const btn = document.getElementById('sendCodeBtn') || document.getElementById('resendBtn');
            btn.disabled = true;

            try {
                const res = await fetch(API_BASE + '/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'sendCode', email, source: 'reset' })
                });
                const data = await res.json();
                if (data.code === 200) {
                    showMsg('验证码已发送', 'success');
                    document.getElementById('emailDisplay').textContent = email;
                    goToStep(2);
                    startCountdown();
                } else {
                    showMsg(data.msg, 'error');
                    btn.disabled = false;
                }
            } catch (err) {
                showMsg('网络错误', 'error');
                btn.disabled = false;
            }
        }

        function startCountdown() {
            const btn = document.getElementById('resendBtn');
            let seconds = 60;
            btn.disabled = true;
            btn.textContent = seconds + 's';
            if (countdownTimer) clearInterval(countdownTimer);
            countdownTimer = setInterval(() => {
                seconds--;
                btn.textContent = seconds + 's';
                if (seconds <= 0) {
                    clearInterval(countdownTimer);
                    btn.disabled = false;
                    btn.textContent = '重新发送';
                }
            }, 1000);
        }

        function goToStep3() {
            const code = document.getElementById('code').value.trim();
            if (!code || code.length !== 6) {
                showMsg('请输入6位验证码', 'error');
                return;
            }
            showMsg('', '');
            goToStep(3);
        }

        async function resetPassword() {
            const email = document.getElementById('email').value.trim();
            const code = document.getElementById('code').value.trim();
            const newPw = document.getElementById('newPassword').value;
            const confirmPw = document.getElementById('confirmPassword').value;
            const btn = document.getElementById('resetBtn');

            if (!newPw) {
                showMsg('请输入新密码', 'error');
                return;
            }
            if (newPw.length < 8) {
                showMsg('新密码长度不能少于8位', 'error');
                return;
            }
            if (newPw !== confirmPw) {
                showMsg('两次输入的密码不一致', 'error');
                return;
            }

            btn.disabled = true;
            btn.textContent = '重置中...';

            try {
                const res = await fetch(API_BASE + '/account/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, code, new_password: newPw })
                });
                const data = await res.json();
                if (data.code === 200) {
                    showMsg('密码重置成功，即将跳转登录页...', 'success');
                    setTimeout(() => { window.location.href = '/login'; }, 2000);
                } else {
                    showMsg(data.msg, 'error');
                }
            } catch (err) {
                showMsg('网络错误', 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = '重置密码';
            }
        }
    </script>
</body>
</html>
