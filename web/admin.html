document.addEventListener('keydown', function (e) {
  var t = e.target;
  if ((e.key === 'Enter' || e.key === ' ') && t && t.getAttribute && t.getAttribute('role') === 'button') {
    e.preventDefault();
    t.click();
  }
});
function toast(msg,bad){const t=document.getElementById('toast');if(!t)return;t.textContent=msg;t.className='toast'+(bad?' bad':'');t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>{t.hidden=true;},3000);}

const API = '/api';
let adminToken = null;
let currentPage = 1;
let currentSort = 'created_at';
let currentOrder = 'DESC';
let chartInstances = {};

const chartColors = [
    '#265a48', '#3d7156', '#4a8963', '#6f9e7c',
    '#91b49b', '#a6372d', '#b78969', '#c9a227',
    '#2f6f8f', '#55805c', '#7a9a6a', '#8ba397',
    '#00362f', '#428b62', '#9c6b4f', '#b5893a'
];

function getAdminHeaders() {
    return { 'Authorization': 'Bearer ' + adminToken, 'Content-Type': 'application/json' };
}

async function adminLogin() {
    const prefix = document.getElementById('adminPrefix').value.trim();
    const suffix = document.getElementById('adminSuffix').value;
    const username = prefix ? prefix + '@' + suffix : document.getElementById('adminUsername').value.trim();
    const password = document.getElementById('adminPass').value;
    const btn = document.getElementById('loginBtn');
    const msg = document.getElementById('loginMsg');
    if (!username || !password) { msg.textContent = '请输入用户名和密码'; msg.className = 'msg error'; return; }
    btn.disabled = true;
    btn.textContent = '登录中...';
    try {
        const res = await fetch(API + '/admin/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username, password }) });
        const data = await res.json();
        if (data.code === 200) {
            adminToken = data.token;
            localStorage.setItem('adminToken', adminToken);
            document.getElementById('adminName').textContent = data.username || username;
            document.getElementById('loginPage').style.display = 'none';
            document.getElementById('adminPage').classList.add('active');
            loadStats();
            loadUsers(1);
        } else if (data.code === 429) {
            msg.textContent = data.msg;
            msg.className = 'msg error';
            const waitMatch = data.msg.match(/(\d+)/);
            if (waitMatch) {
                let seconds = parseInt(waitMatch[1]);
                btn.disabled = true;
                btn.textContent = '请等待 ' + seconds + ' 秒';
                const interval = setInterval(function() {
                    seconds--;
                    if (seconds <= 0) {
                        clearInterval(interval);
                        btn.disabled = false;
                        btn.textContent = '登录';
                        msg.textContent = '';
                        msg.className = 'msg';
                    } else {
                        btn.textContent = '请等待 ' + seconds + ' 秒';
                    }
                }, 1000);
            }
        } else {
            msg.textContent = data.msg || '登录失败';
            msg.className = 'msg error';
        }
    } catch (e) { msg.textContent = '网络错误'; msg.className = 'msg error'; }
    btn.disabled = false;
    btn.textContent = '登录';
}

function adminLogout() {
    adminToken = null;
    localStorage.removeItem('adminToken');
    document.getElementById('loginPage').style.display = 'flex';
    document.getElementById('adminPage').classList.remove('active');
    Object.values(chartInstances).forEach(function(c) { if (c && c.destroy) c.destroy(); });
    chartInstances = {};
}

function switchTab(tab) {
    document.querySelectorAll('.tab').forEach(function(t) { t.classList.toggle('active', t.dataset.tab === tab); });
    document.querySelectorAll('.panel').forEach(function(p) { p.classList.toggle('active', p.id === 'panel' + tab.charAt(0).toUpperCase() + tab.slice(1)); });
    if (tab === 'stats') loadStats();
    if (tab === 'assistant') initAssistant();
}

async function loadStats() { return window.loadOperationsStats(); }

async function loadUsers(page) {
    currentPage = page;
    var search = document.getElementById('searchInput').value.trim();
    var sex = document.getElementById('filterSex').value;
    var campus = document.getElementById('filterCampus').value;
    var grade = document.getElementById('filterGrade').value;
    var joinMatching = document.getElementById('filterMatching').value;

    var params = 'page=' + page + '&pageSize=20&sort=' + currentSort + '&order=' + currentOrder;
    if (search) params += '&search=' + encodeURIComponent(search);
    if (sex) params += '&sex=' + encodeURIComponent(sex);
    if (campus) params += '&campus=' + encodeURIComponent(campus);
    if (grade) params += '&grade=' + encodeURIComponent(grade);
    if (joinMatching) params += '&join_matching=' + encodeURIComponent(joinMatching);

    try {
        var res = await fetch(API + '/admin/users?' + params, { headers: getAdminHeaders() });
        var result = await res.json();
        if (result.code !== 200) return;

        var data = result.data;
        var total = result.total;
        var pageSize = result.pageSize;
        document.getElementById('totalCount').textContent = '共 ' + total + ' 条';
        var totalPages = Math.ceil(total / pageSize);

        var tbody = document.getElementById('userTableBody');
        tbody.innerHTML = '';
        data.forEach(function(u) {
            var tagSex = u.sex === '男' ? '<span class="tag tag-male">男</span>' : u.sex === '女' ? '<span class="tag tag-female">女</span>' : '-';
            var tagMatch = u.join_matching == 1 ? '<span class="tag tag-on">参与</span>' : '<span class="tag tag-off">未参与</span>';
            var serial = escHtml(u.serial_number || '');
            var detailKey = serial || ('account-' + Number(u.account_id));
            var materialButtons = '';
            if(u.account_id){
                var aid=Number(u.account_id);
                materialButtons = ' <button class="btn-sm" onclick="viewMaterials('+aid+',\'love\')" '+(!u.has_love&&!serial?'disabled':'')+'>恋爱问卷'+(!u.has_love&&!serial?'（未填写）':'')+'</button>'
                + ' <button class="btn-sm" onclick="viewMaterials('+aid+',\'deep\')" '+(!u.has_deep&&!u.has_legacy_deep?'disabled':'')+'>深度交友问卷'+(!u.has_deep&&!u.has_legacy_deep?'（未填写）':'')+'</button>'
                + ' <button class="btn-sm" onclick="viewMaterials('+aid+',\'cards\')" '+(!u.buddy_count?'disabled':'')+'>搭子卡（'+Number(u.buddy_count||0)+'）</button>';
                if(!u.has_love&&serial)materialButtons=materialButtons.replace('viewMaterials('+aid+',\'love\')','viewDetail(\''+serial+'\')');
            }

            tbody.innerHTML += '<tr><td>' + escHtml(u.nickname || '-') + '</td><td>' + tagSex + '</td><td>' + escHtml(u.campus || '-') + '</td><td>' + escHtml(u.grade || '-') + '</td><td>' + escHtml(u.height || '-') + '</td><td>' + escHtml(u.mbti || '-') + '</td><td>' + (u.created_at ? u.created_at.slice(0, 10) : '-') + '</td><td>' + tagMatch + '</td><td><button class="btn-sm" onclick="viewDetail(\'' + serial + '\')">基本资料</button>' + materialButtons + (serial ? ' <button class="btn-sm danger" onclick="deleteUser(\'' + serial + '\')">删除问卷</button>' : '') + '</td></tr>';
        });

        var pagHtml = '';
        if (totalPages <= 1) {
            document.getElementById('pagination').innerHTML = '';
            return;
        }
        pagHtml += '<button ' + (currentPage <= 1 ? 'disabled' : '') + ' onclick="loadUsers(' + (currentPage - 1) + ')">上一页</button>';
        var start = Math.max(1, currentPage - 2);
        var end = Math.min(totalPages, currentPage + 2);
        if (start > 1) { pagHtml += '<button onclick="loadUsers(1)">1</button>'; if (start > 2) pagHtml += '<span style="color:#8ba397">...</span>'; }
        for (var p = start; p <= end; p++) { pagHtml += '<button ' + (p === currentPage ? 'class="active"' : '') + ' onclick="loadUsers(' + p + ')">' + p + '</button>'; }
        if (end < totalPages) { if (end < totalPages - 1) pagHtml += '<span style="color:#8ba397">...</span>'; pagHtml += '<button onclick="loadUsers(' + totalPages + ')">' + totalPages + '</button>'; }
        pagHtml += '<button ' + (currentPage >= totalPages ? 'disabled' : '') + ' onclick="loadUsers(' + (currentPage + 1) + ')">下一页</button>';
        pagHtml += '<span class="page-info">第 ' + currentPage + ' / ' + totalPages + ' 页</span>';
        document.getElementById('pagination').innerHTML = pagHtml;
    } catch (e) { console.error(e); }
}

function sortBy(field) {
    if (currentSort === field) {
        currentOrder = currentOrder === 'DESC' ? 'ASC' : 'DESC';
    } else {
        currentSort = field;
        currentOrder = 'DESC';
    }
    document.querySelectorAll('.sort-arrow').forEach(function(el) { el.textContent = ''; });
    document.getElementById('sort-' + field).textContent = currentOrder === 'DESC' ? '↓' : '↑';
    loadUsers(1);
}


async function viewMaterials(id,kind){
 try{
 const r=await fetch(API+'/admin/accounts/'+id+'/materials',{headers:getAdminHeaders()});const d=await r.json();
 if(!r.ok||d.code!==200)throw Error(d.msg||'读取失败');
 const labels={sex:'性别',grade:'年级',major:'专业',hometown:'家乡',school:'学校',own_campus:'所在校区',campus:'校区',mbti:'MBTI',interests:'兴趣',self_description:'自我介绍',bio:'自我介绍',ideal_friend:'理想朋友',friend_goal:'交友目的',photos:'照片',display_self:'展示信息',contact_info:'联系方式',contact_entries:'联系方式',wechat:'微信',phone:'手机',email:'邮箱',gender:'性别',time:'时间',location:'地点',note:'补充说明',category:'分类',subcategories:'子分类',value:'内容',type:'类型',enabled:'是否开启',important:'重视的题目',version:'问卷版本',updated_at:'更新时间',answers:'问卷答案'};
 function fields(obj){if(obj===null||obj===undefined)return '未填写';if(Array.isArray(obj))return obj.map(x=>typeof x==='object'?fields(x):escHtml(String(x))).join('、');if(typeof obj!=='object')return escHtml(String(obj));return '<div class="detail-grid">'+Object.entries(obj).map(([k,v])=>'<div class="detail-field"><label>'+escHtml(labels[k]||k)+'</label><div class="val" style="white-space:pre-wrap;overflow-wrap:anywhere">'+fields(v)+'</div></div>').join('')+'</div>';}
 let title={love:'恋爱问卷',deep:'深度交友问卷',cards:'搭子卡'}[kind],body='';
 if(kind==='love'){
 if(d.love){const qs=window.WeeklySchema.questions;const answers=d.love.answers;body='<p>更新：'+escHtml(String(d.love.updated_at||''))+'</p>'+Object.entries(answers).map(([k,v])=>{const q=qs.find(q=>String(q.id)===k);return '<div class="detail-field"><label>'+escHtml(q?q.title:k)+'</label><div class="val">'+fields(v)+'</div></div>';}).join('')+'<h3>重点偏好</h3>'+fields(d.love.important);}else body='未填写恋爱问卷';
 }else if(kind==='deep')body=(d.deep_legacy?'<p>历史问卷，尚未重新保存新版偏好。</p>':'')+fields(d.deep);
 else body=d.cards.map(c=>{const t=window.FriendsSchema.TYPES[c.type];if(t){labels[t.main.key]=t.main.label;for(const x of t.extra||[])labels[x.key]=x.label;}return '<section class="detail-section"><h3>'+escHtml(t?t.name:c.type)+' · '+(c.enabled?'已开启':'已暂停')+'</h3>'+fields(c.data)+'</section>';}).join('')||'暂无搭子卡';
 document.getElementById('detailBox').innerHTML='<button class="close-btn" onclick="closeDetail()">×</button><h2>'+title+'</h2>'+body;
 document.getElementById('detailOverlay').classList.add('active');
 }catch(e){uiAlert({title:'读取失败',body:e.message||'请稍后重试'});}
}

async function viewDetail(serial) {
    try {
        var res = await fetch(API + '/admin/user/' + serial, { headers: getAdminHeaders() });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        var result = await res.json();
        if (result.code !== 200) { uiAlert({title:'获取失败',body:result.msg||'请稍后重试'}); return; }
        var u = result.data;
        var rawPhotos = u.photos;
        var photos = [];
        if (rawPhotos && typeof rawPhotos === 'string') {
            try { photos = JSON.parse(rawPhotos.replace(/'/g, '"')).filter(function(p) { return p; }); }
            catch(e) { photos = []; }
        } else if (Array.isArray(rawPhotos)) {
            photos = rawPhotos.filter(function(p) { return p; });
        }
        var photoHtml = photos.map(function(p) { return '<img src="' + escHtml(p) + '" alt="用户照片" onclick="showImage(this.src)">'; }).join('');
        var fields = [
            ['账号 ID', u.account_id], ['邮箱验证', u.email_verified == 1 ? '已验证' : '未验证'], ['序列号', u.serial_number], ['昵称', u.nickname], ['性别', u.sex], ['校区', u.campus],
            ['年级', u.grade], ['专业', u.major], ['身高', u.height ? u.height + ' cm' : '-'], ['体重', u.weight ? u.weight + ' kg' : '-'],
            ['生日', u.birthday], ['星座', u.constellation], ['MBTI', u.mbti],
            ['恋爱目的', u.relationship_goal], ['理想对象', u.ideal_partner],
            ['自我介绍', u.self_description], ['微信号', u.wechat], ['手机号', u.phone],
            ['邮箱', u.email], ['参与匹配', u.join_matching == 1 ? '是' : '否'],
            ['注册时间', u.created_at ? u.created_at.slice(0, 19) : '-']
        ];
        var infoHtml = '<h2>' + escHtml(u.nickname || u.serial_number) + '</h2>';
        infoHtml += '<div class="detail-section"><h3>基本信息</h3><div class="detail-grid">';
        fields.forEach(function(f) {
            if (f[1] !== null && f[1] !== undefined && f[1] !== '') {
                infoHtml += '<div class="detail-field"><label>' + f[0] + '</label><div class="val">' + escHtml(String(f[1])) + '</div></div>';
            }
        });
        infoHtml += '</div></div>';
        if (photoHtml) {
            infoHtml += '<div class="detail-section"><h3>照片</h3><div class="detail-photos">' + photoHtml + '</div></div>';
        }
        document.getElementById('detailBox').innerHTML = '<button class="close-btn" onclick="closeDetail()">×</button>' + infoHtml;
        document.getElementById('detailOverlay').classList.add('active');
    } catch (e) { console.error('viewDetail error:', e); uiAlert({title:'网络错误',body:'请重试'}); }
}

function showImage(src) {

async function deleteUser(serial) {
    if (!await uiConfirm({title:'删除问卷',body:'确认删除用户 ' + serial + ' 的问卷？此操作不可恢复。',okText:'删除',danger:true})) return;
    try {
        var res = await fetch(API + '/admin/user/' + serial, { method: 'DELETE', headers: getAdminHeaders() });
        var result = await res.json();
        if (result.code === 200) {
            toast('删除成功');
            loadUsers(currentPage);
            closeDetail();
        } else {
            uiAlert({title:'删除失败',body:result.msg||'请稍后重试'});
        }
    } catch (e) { uiAlert({title:'网络错误',body:'请重试'}); }
}

function escHtml(str) {
    var div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
}

async function loadChatHistory() {
    try {
        const res = await fetch(API + '/admin/chat/list', { headers: getAdminHeaders() });
        const result = await res.json();
        if (result.code === 200) {
            chatHistory = {};
            result.data.forEach(function(chat) {
                chatHistory[chat.id] = chat;
                chatHistory[chat.id].messages = [];
            });
            renderChatList();
            if (Object.keys(chatHistory).length > 0) {
                const lastChatId = Object.keys(chatHistory).sort(function(a, b) {
                    return new Date(chatHistory[b].updatedAt) - new Date(chatHistory[a].updatedAt);
                })[0];
                loadChat(lastChatId);
            } else {
                createNewChat();
            }
        }
    } catch (e) {
        console.error('loadChatHistory error:', e);
        if (Object.keys(chatHistory).length === 0) {
            createNewChat();
        }
    }
}

function saveChatHistory() {
    if (chatSaveTimer) clearTimeout(chatSaveTimer);
    chatSaveTimer = setTimeout(function() {
        if (currentChatId && chatHistory[currentChatId]) {
            const chat = chatHistory[currentChatId];
            fetch(API + '/admin/chat/save', {
                method: 'POST',
                headers: getAdminHeaders(),
                body: JSON.stringify({
                    id: chat.id,
                    title: chat.title,
                    messages: chat.messages
                })
            }).catch(function(e) { console.error('save chat error:', e); });
        }
    }, 500);
}

function createNewChat() {
    const chatId = 'chat_' + Date.now();
    chatHistory[chatId] = {
        id: chatId,
        title: '新对话',
        messages: [],
        createdAt: new Date().toISOString(),
        updatedAt: new Date().toISOString()
    };
    saveChatHistory();
    loadChat(chatId);
    renderChatList();
}

async function loadChat(chatId) {
    currentChatId = chatId;
    const chat = chatHistory[chatId];
    if (!chat) return;

    if (chat.messages.length === 0 && chat.id) {
        try {
            const res = await fetch(API + '/admin/chat/' + chat.id, { headers: getAdminHeaders() });
            const result = await res.json();
            if (result.code === 200 && result.data) {
                chat.messages = result.data.messages || [];
                chat.title = result.data.title || chat.title;
                chatHistory[chatId] = chat;
            }
        } catch (e) {
            console.error('loadChat messages error:', e);
        }
    }

    renderChatList();
    renderMessages(chat.messages);
}

async function deleteChat(chatId, event) {
    event.stopPropagation();
    if (!await uiConfirm({title:'删除对话',body:'确定要删除这个对话吗？',okText:'删除',danger:true})) return;

    fetch(API + '/admin/chat/' + chatId, { method: 'DELETE', headers: getAdminHeaders() }).catch(function(e) { console.error('delete chat error:', e); });

    delete chatHistory[chatId];

    if (currentChatId === chatId) {
        if (Object.keys(chatHistory).length > 0) {
            const lastChatId = Object.keys(chatHistory).sort(function(a, b) {
                return new Date(chatHistory[b].updatedAt) - new Date(chatHistory[a].updatedAt);
            })[0];
            loadChat(lastChatId);
        } else {
            createNewChat();
        }
    } else {
        renderChatList();
    }
}

function renderChatList() {
    const chatList = document.getElementById('chatList');
    if (!chatList) return;

    const sortedChats = Object.values(chatHistory).sort(function(a, b) {
        return new Date(b.updatedAt) - new Date(a.updatedAt);
    });

    chatList.innerHTML = sortedChats.map(function(chat) {
        const isActive = chat.id === currentChatId;
        const time = new Date(chat.updatedAt).toLocaleString('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
        return '<div class="chat-item ' + (isActive ? 'active' : '') + '" role="button" tabindex="0" onclick="loadChat(\'' + chat.id + '\')">' +
            '<span class="chat-item-delete" role="button" tabindex="0" aria-label="删除对话" onclick="deleteChat(\'' + chat.id + '\', event)">×</span>' +
            '<div class="chat-item-title">' + escHtml(chat.title) + '</div>' +
            '<div class="chat-item-time">' + time + '</div>' +
            '</div>';
    }).join('');
}

function renderMessages(messages) {
    const container = document.getElementById('chatMessages');
    if (!container) return;

    if (messages.length === 0) {
        container.innerHTML = '<div class="welcome-message">' +
            '<h2>👋 你好！我是 FancyU AI 助手</h2>' +
            '<p>我可以帮你查询数据库、分析数据、回答问题。你可以问我：</p>' +
            '<div class="example-questions">' +
            '<div class="example-item" role="button" tabindex="0" onclick="askExample(\'查询最近7天注册的用户\')">📊 查询最近7天注册的用户</div>' +
            '<div class="example-item" role="button" tabindex="0" onclick="askExample(\'比较三种配对方式的参与人数和交换率\')">📈 比较三种配对方式的参与人数和交换率</div>' +
            '<div class="example-item" role="button" tabindex="0" onclick="askExample(\'统计当前开启的搭子卡类别\')">🔍 统计当前开启的搭子卡类别</div>' +
            '<div class="example-item" role="button" tabindex="0" onclick="askExample(\'分析最近30天的注册趋势\')">🧠 分析最近30天的注册趋势</div>' +
            '</div></div>';
        return;
    }

    container.innerHTML = messages.map(function(msg) {
        const time = new Date(msg.timestamp).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
        const avatar = msg.role === 'user' ? '你' : 'AI';
        return '<div class="message ' + msg.role + '">' +
            '<div class="message-avatar">' + avatar + '</div>' +
            '<div class="message-content">' +
            '<div class="message-bubble">' + formatMessage(msg.content) + '</div>' +
            '<div class="message-time">' + time + '</div>' +
            '</div></div>';
    }).join('');

    container.scrollTop = container.scrollHeight;
}

function formatMessage(content) {
    return String(content).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;", "'":"&#39;"}[c]))
        .replace(/```([\s\S]*?)```/g, '<pre class="code-block">$1</pre>')
        .replace(/`([^`]+)`/g, '<code style="background:#e4ebe0;padding:2px 6px;border-radius:4px;font-family:monospace;">$1</code>')
        .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
        .replace(/\n/g, '<br>');
}

function askExample(question) {
    document.getElementById('chatInput').value = question;
    sendMessage();
}

function handleKeyDown(event) {
    if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
    }
}

async function sendMessage() {
    const input = document.getElementById('chatInput');
    const message = input.value.trim();
    if (!message) return;

    input.value = '';
    input.style.height = 'auto';

    const chat = chatHistory[currentChatId];
    if (!chat) return;

    chat.messages.push({
        role: 'user',
        content: message,
        timestamp: new Date().toISOString()
    });

    if (chat.messages.length === 1) {
        chat.title = message.substring(0, 30) + (message.length > 30 ? '...' : '');
    }

    chat.updatedAt = new Date().toISOString();
    saveChatHistory();
    renderMessages(chat.messages);
    renderChatList();

    showTypingIndicator();

    try {
        const response = await queryDatabase(message);

        hideTypingIndicator();

        chat.messages.push({
            role: 'assistant',
            content: response,
            timestamp: new Date().toISOString()
        });

        chat.updatedAt = new Date().toISOString();
        saveChatHistory();
        renderMessages(chat.messages);
    } catch (error) {
        hideTypingIndicator();

        chat.messages.push({
            role: 'assistant',
            content: '抱歉，查询数据库时出现错误：' + error.message,
            timestamp: new Date().toISOString()
        });

        chat.updatedAt = new Date().toISOString();
        saveChatHistory();
        renderMessages(chat.messages);
    }
}

async function queryDatabase(query) {
    const systemPrompt = '你是 FancyU 数据库助手。你可以帮助管理员查询和分析用户数据。\n\n' +
        '可用的数据库表：\n' +
        '- users: 用户问卷数据（包含字段：serial_number, nickname, sex, campus, grade, major, height, weight, birthday, constellation, mbti, relationship_goal, ideal_partner, self_description, wechat, phone, email, join_matching, created_at）\n\n' +
        '当用户提出查询需求时，你需要：\n' +
        '1. 理解用户的查询意图\n' +
        '2. 使用提供的 API 查询数据\n' +
        '3. 以友好的方式总结和展示结果\n\n' +
        'API 使用说明：\n' +
        '- 查询用户列表：GET ' + API + '/admin/users?page=1&pageSize=20\n' +
        '- 查询单个用户：GET ' + API + '/admin/user/{serial_number}\n' +
        '- 统计数据：GET ' + API + '/admin/stats\n\n' +
        '注意：所有 API 请求都需要在 header 中添加 Authorization: Bearer ' + adminToken;

    const messages = [
        { role: 'system', content: systemPrompt },
        { role: 'user', content: query }
    ];

    const response = await fetch(LLM_API, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + adminToken
        },
        body: JSON.stringify({
            messages: messages,
            max_tokens: 2000,
            temperature: 0.7
        })
    });

    if (!response.ok) {
        throw new Error('LLM API 请求失败');
    }

    const result = await response.json();
    if (result.code !== 200) {
        throw new Error(result.msg || 'LLM 服务错误');
    }

    return result.data.choices[0].message.content;
}

function showTypingIndicator() {
    const container = document.getElementById('chatMessages');
    const indicator = document.createElement('div');
    indicator.className = 'message assistant';
    indicator.id = 'typingIndicator';
    indicator.innerHTML = '<div class="message-avatar">AI</div>' +
        '<div class="message-content"><div class="message-bubble">' +
        '<div class="typing-indicator"><span></span><span></span><span></span></div>' +
        '</div></div>';
    container.appendChild(indicator);
    container.scrollTop = container.scrollHeight;
}

function hideTypingIndicator() {
    const indicator = document.getElementById('typingIndicator');
    if (indicator) indicator.remove();
}

(function() {
    var saved = localStorage.getItem('adminToken');
    if (saved) {
        adminToken = saved;
        document.getElementById('loginPage').style.display = 'none';
        document.getElementById('adminPage').classList.add('active');
        try { document.getElementById('adminName').textContent = JSON.parse(decodeURIComponent(escape(atob(saved.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))))).username || '管理员'; } catch(e) { document.getElementById('adminName').textContent = '管理员'; }
        loadStats();
        loadUsers(1);
        initAssistant();
        var _h = (location.hash || '').replace('#', '');
        if (_h === 'users' || _h === 'assistant' || _h === 'stats') switchTab(_h);
    }
})();
