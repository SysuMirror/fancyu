<!doctype html><html lang="zh-CN" data-ui="campus"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>支付定价 · FancyU 管理后台</title><link rel="stylesheet" href="/campus-ui.css?v=20261112a"><link rel="stylesheet" href="/admin-ui.css?v=20261113d"><script defer src="/admin-shell.js?v=20261117a"></script><script defer src="/ui-dialog.js?v=20261113c"></script><script defer src="/admin-pay.js"></script><!-- brand: icon + theme + share --><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="alternate icon" href="/favicon.ico" sizes="any"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><meta name="theme-color" content="#faf9f5"></head>
<body data-ui="campus" data-page="admin"><div data-admin-shell></div><main>
<header><h1>支付定价</h1><button id="refresh">刷新</button></header>
<p class="notice">价格完全由本后台自定义，下单时<strong>小程序无需任何改动</strong>即可跳转微信支付。金额单位为元（支持两位小数）。回调验签后自动发放权益。</p>
<div id="stats" class="stats" aria-live="polite">…</div>
<div id="app" aria-live="polite">正在读取…</div>
<section class="card"><h2>新增 / 修改商品</h2>
<form id="item-form" autocomplete="off">
  <label>标识 item_key<input name="item_key" placeholder="如 vip_30d" required></label>
  <label>名称<input name="title" placeholder="如 会员 30 天" required></label>
  <label>价格（元）<input name="amount_yuan" type="number" min="0.01" step="0.01" required></label>
  <label>有效期（天，留空=永久）<input name="duration_days" type="number" min="0" step="1" placeholder="如 30"></label>
  <label>说明<input name="description" placeholder="可选"></label>
  <label class="inline"><input type="checkbox" name="is_active" checked> 上架</label>
  <button class="primary" type="submit">保存</button>
</form></section>
<section class="card"><h2>最近订单</h2><div id="orders">…</div></section>
</main><div class="toast" id="toast" role="status" hidden></div></body></html>
