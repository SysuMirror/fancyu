<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light"><title>个人中心 | FancyU · 中意你</title><link rel="stylesheet" href="profile-center.css?v=20261116c"><script src="auth-session.js?v=20261117e"></script><script src="/auth-image.js?v=1" defer></script><script defer src="profile-actions.js?v=20261116b"></script><script defer src="profile-center.js?v=20261117e"></script><script src="chat-badge.js?v=20261116b" defer></script><meta name="description" content="FancyU · 中意你 个人中心：修改昵称、密码与账号信息。"><!-- brand: icon + theme + share --><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="alternate icon" href="/favicon.ico" sizes="any"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="manifest" href="/manifest.webmanifest"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="中意你"><!-- PWA：可安装 + 离线兜底 + 通知铃铛（脚本自含样式，失败静默） --><script src="/pwa.js?v=1" defer></script><script src="/notifications-badge.js?v=20261116b" defer></script><meta name="theme-color" content="#faf9f5"><meta property="og:type" content="website"><meta property="og:site_name" content="FancyU · 中意你"><meta property="og:title" content="个人中心 | FancyU · 中意你"><meta property="og:description" content="FancyU · 中意你 个人中心：修改昵称、密码与账号信息。"><meta property="og:image" content="https://ssemarket.cn:23028/og.png"><meta property="og:url" content="https://ssemarket.cn:23028/profile"><meta name="twitter:card" content="summary_large_image"></head><link rel="stylesheet" href="/page-enter.css?v=20261117b"><link rel="stylesheet" href="/install-guide.css?v=20261117f"><script src="/install-guide.js?v=20261117f" defer><body><header class="site-header"><a class="brand" href="/">FancyU · 中意你</a><a href="/">返回首页 <span aria-hidden="true">↗</span></a><a href="/chat" data-chat-link hidden>消息<span data-chat-badge></span></a></header>
<main><div class="page-heading"><h1>个人中心</h1><p>查看参与状态，管理你的资料。</p></div>
<section class="install-guide" id="installGuide" data-install-guide aria-labelledby="installGuideTitle"><h2 id="installGuideTitle">装到主屏幕</h2><div data-install-panel="prompt" hidden><p>把中意你装到主屏幕，下次从图标直接打开。</p><button type="button" data-install-action="prompt">安装到主屏幕</button></div><div data-install-panel="ios-steps" hidden><p>在 Safari 依次点「分享 → 添加到主屏幕」。Web Push 只有从主屏幕图标打开之后才能使用。</p></div><div data-install-panel="manual"><p>把中意你装到主屏幕，下次从图标直接打开。</p><ol><li>电脑：点地址栏右侧的安装图标，或打开浏览器菜单，选择「安装应用」或「添加到主屏幕」。</li><li>手机 Chrome、Edge：点右上角菜单，选择「安装应用」或「添加到主屏幕」。</li><li>iPhone、iPad：请用 Safari，点底部「分享」，再点「添加到主屏幕」。</li></ol><p>系统通知要从主屏幕图标打开之后才会送达。</p></div></section>
<section class="identity" aria-label="我的账号"><button class="avatar" id="profileAvatar" type="button" onclick="pickAvatar()" aria-label="上传或更换头像" title="点击上传或更换头像">F</button><input type="file" id="avatarFile" accept="image/jpeg,image/png,image/webp" hidden onchange="uploadAvatar(this.files[0]);this.value=''"><div class="identity-info"><div class="identity-title"><h2 id="profileName">正在读取账号</h2><a class="badge neutral" id="verificationBadge" href="/verify-student">认证状态读取中</a></div><p id="profileEmail">—</p><p id="accountError" class="error" hidden>账号读取失败，请刷新重试。</p></div><button class="edit-name" onclick="openNicknameModal()">修改昵称</button></section>
<section class="guide-section" aria-labelledby="guideTitle"><h2 id="guideTitle">资料完善度</h2><div class="guide-card" id="guideCard"><div class="guide-head"><strong id="guidePercent">读取中…</strong><button class="retry" id="guideRetry" type="button" hidden>重新读取</button></div><div class="guide-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="guideBarWrap"><span id="guideBar"></span></div><ul class="guide-list" id="guideList"></ul></div><p class="section-note">把这几项补齐，配对成功率会明显提高。</p></section>
<section class="participation-section" aria-labelledby="participationTitle"><h2 id="participationTitle">我的参与</h2><div class="participation-grid" aria-live="polite">
<article class="participation" id="weeklyCard" aria-labelledby="weeklyTitle"><div class="card-heading"><h3 id="weeklyTitle">每周恋爱</h3><span class="badge neutral" id="weeklyStatus">读取中</span></div><dl><div><dt>恋爱问卷</dt><dd id="weeklyDetail">读取中…</dd></div><div><dt>当前状态</dt><dd id="weeklyProgress">读取中…</dd></div></dl><a class="action" id="weeklyAction" href="/weekly-match">进入板块 →</a><a class="secondary-link" id="weeklySecondary" href="/survey">管理问卷</a><button class="retry" data-retry="weekly" hidden>重新读取</button></article><article class="participation" id="deepCard" aria-labelledby="deepTitle"><div class="card-heading"><h3 id="deepTitle">深度交友</h3><span class="badge neutral" id="deepStatus">读取中</span></div><dl><div><dt>交友问卷</dt><dd id="deepDetail">读取中…</dd></div><div><dt>当前状态</dt><dd id="deepProgress">读取中…</dd></div></dl><a class="action" id="deepAction" href="/deep">进入板块 →</a><a class="secondary-link" id="deepSecondary" href="/friend_survey">管理问卷</a><button class="retry" data-retry="deep" hidden>重新读取</button></article><article class="participation" id="buddyCard" aria-labelledby="buddyTitle"><div class="card-heading"><h3 id="buddyTitle">约个搭子</h3><span class="badge neutral" id="buddyStatus">读取中</span></div><dl><div><dt>活动卡片</dt><dd id="buddyDetail">读取中…</dd></div><div><dt>参与方式</dt><dd id="buddyProgress">读取中…</dd></div></dl><a class="action" id="buddyAction" href="/friends#quick">进入板块 →</a><a class="secondary-link" id="buddySecondary" href="/friends#quick">查看配对记录</a><button class="retry" data-retry="buddy" hidden>重新读取</button></article></div>
<p class="section-note">报名、暂停与配对结果，在各板块内统一管理。</p></section>
<section class="security" aria-labelledby="securityTitle"><h2 id="securityTitle">账号与安全</h2><div class="settings"><a href="/verify-student"><span>学生认证</span><span><span id="verificationStatus">读取中</span> <span aria-hidden="true">›</span></span></a><button onclick="openContactEmailModal()"><span>联系邮箱</span><span><span id="contactEmailValue">读取中</span> <span aria-hidden="true">›</span></span></button><button onclick="openPasswordModal()"><span>修改密码</span><span aria-hidden="true">›</span></button><button id="inviteEntry" type="button"><span>邀请好友</span><span><span id="inviteCount">—</span> <span aria-hidden="true">›</span></span></button><button id="themeToggle" type="button"><span>深色模式</span><span><span id="themeState">已关闭</span> <span aria-hidden="true">›</span></span></button><button id="logout"><span>退出登录</span><span aria-hidden="true">›</span></button></div><div class="danger-zone"><button class="danger-link" onclick="openDeleteModal()">注销账号</button></div></section></main>
<!-- 修改昵称弹窗 -->
<div class="modal-mask" id="nicknameModal" role="dialog" aria-modal="true" aria-label="修改昵称">
    <div class="modal-content">
        <div class="modal-title">修改昵称</div>
        <div class="form-group">
            <label class="form-label" for="nicknameInput">新昵称</label><input type="text" class="form-input" id="nicknameInput" placeholder="输入新昵称">
        </div>
        <button class="modal-btn" onclick="saveNickname(this)">保存</button>
        <button class="modal-btn secondary" onclick="closeModal('nicknameModal')" style="margin-top:8px;">取消</button>
    </div>
</div>

<!-- 修改密码弹窗 -->
<div class="modal-mask" id="passwordModal" role="dialog" aria-modal="true" aria-label="修改密码">
    <div class="modal-content">
        <div class="modal-title">修改密码</div>
        <div class="form-group">
            <label class="form-label" for="oldPassword">当前密码</label><input type="password" class="form-input" id="oldPassword" placeholder="输入当前密码">
        </div>
        <div class="form-group">
            <label class="form-label" for="newPassword">新密码</label><input type="password" class="form-input" id="newPassword" placeholder="输入新密码（至少8位）">
        </div>
        <div class="form-group">
            <label class="form-label" for="confirmPassword">确认新密码</label><input type="password" class="form-input" id="confirmPassword" placeholder="再次输入新密码">
        </div>
        <button class="modal-btn" onclick="savePassword(this)">保存</button>
        <button class="modal-btn secondary" onclick="closeModal('passwordModal')" style="margin-top:8px;">取消</button>
    </div>
</div>

<!-- 修改联系邮箱弹窗 -->
<div class="modal-mask" id="contactEmailModal" role="dialog" aria-modal="true" aria-label="修改联系邮箱">
    <div class="modal-content">
        <div class="modal-title">修改联系邮箱</div>
        <p style="font-size:13px;color:var(--text-secondary);line-height:1.6;margin-bottom:12px;">用于接收匹配结果等重要提醒，可与验证邮箱不同。</p>
        <div class="form-group">
            <label class="form-label" for="contactEmailInput">联系邮箱</label><input type="email" class="form-input" id="contactEmailInput" placeholder="name@example.com">
        </div>
        <button class="modal-btn" onclick="saveContactEmail(this)">保存</button>
        <button class="modal-btn secondary" onclick="closeModal('contactEmailModal')" style="margin-top:8px;">取消</button>
    </div>
</div>

<!-- 邀请好友弹窗 -->
<div class="modal-mask" id="inviteModal" role="dialog" aria-modal="true" aria-label="邀请好友">
    <div class="modal-content">
        <div class="modal-title">邀请好友</div>
        <p style="font-size:13px;color:var(--text-secondary);line-height:1.6;margin-bottom:12px;">把邀请码或链接发给同学，对方注册后就会记在你的邀请名下。</p>
        <div class="invite-code" id="inviteCode">—</div>
        <p class="muted" id="inviteStat">读取中…</p>
        <button class="modal-btn" type="button" onclick="copyInviteLink()">复制邀请链接</button>
        <button class="modal-btn secondary" type="button" onclick="closeModal('inviteModal')" style="margin-top:8px;">关闭</button>
    </div>
</div>

<!-- 注销账号弹窗 -->
<div class="modal-mask" id="deleteModal" role="dialog" aria-modal="true" aria-label="注销账号">
    <div class="modal-content">
        <div class="modal-title" style="color:var(--sysu-red);">注销账号</div>
        <p style="font-size:14px;color:var(--text-secondary);line-height:1.6;margin-bottom:16px;">此操作将永久删除你的账号及所有数据，包括问卷和匹配记录。此操作不可撤销。</p>
        <div class="form-group">
            <label class="form-label" for="deletePassword">输入密码确认</label><input type="password" class="form-input" id="deletePassword" placeholder="输入当前密码">
        </div>
        <button class="modal-btn danger" onclick="deleteAccount(this)">确认注销</button>
        <button class="modal-btn secondary" onclick="closeModal('deleteModal')" style="margin-top:8px;">取消</button>
    </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div><script defer src="/tabbar.js?v=20261116b"></script>
</body></html>
