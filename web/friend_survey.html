<!DOCTYPE html>
<html lang="zh-CN" data-ui="campus">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>交友问卷 | FancyU · 中意你</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --sysu-green: #005826;
            --sysu-green-light: #007A3D;
            --sysu-green-dark: #003D1A;
            --sysu-red: #A6372D;
            --bg-paper: #F8F6F1;
            --bg-paper-light: #FAFAF8;
            --card-white: #FFFFFF;
            --text-primary: #1A1A1A;
            --text-secondary: #4A4A4A;
            --text-muted: #8A8A8A;
            --border-soft: #E8E6E1;
            --shadow-soft: 0 4px 20px rgba(0, 58, 26, 0.06);
            --shadow-hover: 0 8px 30px rgba(0, 58, 26, 0.10);
        }
        body {
            font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-paper);
            min-height: 100vh;
            color: var(--text-primary);
            position: relative;
            overflow-x: hidden;
            padding-bottom: 100px;
        }
        .container { max-width: 480px; margin: 0 auto; padding: 24px 20px; position: relative; z-index: 1; }
        .header { display: flex; align-items: center; justify-content: space-between; padding: 8px 0 24px; }
        .logo { font-family: 'Noto Serif SC', serif; font-size: 24px; font-weight: 700; color: var(--sysu-green); letter-spacing: 1px; }
        .step-indicator { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
        .step-text { font-family: 'Noto Serif SC', serif; font-size: 13px; color: var(--sysu-green); font-weight: 600; letter-spacing: 2px; }
        .step-progress { flex: 1; height: 3px; background: var(--border-soft); border-radius: 2px; overflow: hidden; }
        .step-progress-fill { height: 100%; background: linear-gradient(90deg, var(--sysu-green) 70%, var(--sysu-red) 100%); border-radius: 2px; transition: width 0.4s ease; }
        .back-link { display: inline-flex; align-items: center; gap: 6px; color: var(--sysu-green); text-decoration: none; font-size: 14px; margin-bottom: 16px; padding: 8px 12px; background: var(--card-white); border-radius: 10px; transition: all 0.2s ease; box-shadow: var(--shadow-soft); }
        .back-link:hover { box-shadow: var(--shadow-hover); }
        .page-title { font-family: 'Noto Serif SC', serif; font-size: 28px; font-weight: 700; color: var(--text-primary); margin-bottom: 32px; line-height: 1.4; }
        .card { background: var(--card-white); border-radius: 20px; padding: 24px; margin-bottom: 16px; box-shadow: var(--shadow-soft); transition: all 0.3s ease; }
        .card:hover { box-shadow: var(--shadow-hover); }
        .card-label { font-family: 'Noto Sans SC', sans-serif; font-size: 14px; font-weight: 600; color: var(--text-secondary); margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
        .card-label .required-mark { color: var(--sysu-red); font-size: 12px; }
        /* 校验定位：标出缺失的必填题，避免"请填写所有必填项"的猜谜 */
        .card.field-missing { box-shadow: 0 0 0 2px var(--sysu-red), var(--shadow-hover); animation: fieldMissingPulse 1.3s ease 2; }
        @keyframes fieldMissingPulse { 0%, 100% { box-shadow: 0 0 0 2px var(--sysu-red), var(--shadow-hover); } 50% { box-shadow: 0 0 0 6px rgba(158, 45, 48, 0.14), var(--shadow-hover); } }
        @media (prefers-reduced-motion: reduce) { .card.field-missing { animation: none; } }
        .sub-label { font-size: 13px; color: var(--text-muted); margin-bottom: 10px; font-weight: 500; }
        .input-wrapper { flex: 1; }
        .input-field { width: 100%; padding: 14px 0; font-size: 16px; font-family: 'Noto Sans SC', sans-serif; border: none; border-bottom: 2px solid var(--border-soft); background: transparent; outline: none; transition: border-color 0.3s ease; color: var(--text-primary); }
        .input-field:focus { border-bottom-color: var(--sysu-green); }
        .input-field::placeholder { color: var(--text-muted); }
        .input-hint { font-size: 12px; color: var(--text-muted); margin-top: 8px; }
        .option-group { display: flex; flex-direction: column; gap: 10px; }
        .option-btn { padding: 12px 16px; border-radius: 12px; font-size: 15px; font-weight: 500; cursor: pointer; transition: all 0.25s ease; background: var(--bg-paper); color: var(--text-secondary); border: none; text-align: center; }
        .option-btn:hover { background: var(--bg-paper-light); }
        .option-btn.selected { background: var(--sysu-green); color: white; font-weight: 600; }
        .option-row { display: flex; gap: 8px; flex-wrap: wrap; }
        .option-row .option-btn { flex: 1; min-width: 60px; padding: 10px 8px; font-size: 14px; }
        .select-wrapper { position: relative; margin-bottom: 12px; }
        .select-wrapper:last-child { margin-bottom: 0; }
        .select-field { width: 100%; padding: 14px 40px 14px 16px; font-size: 15px; font-family: 'Noto Sans SC', sans-serif; border: none; border-radius: 12px; background: var(--bg-paper); color: var(--text-primary); cursor: pointer; appearance: none; outline: none; transition: all 0.2s ease; }
        .select-field:focus { background: var(--bg-paper-light); box-shadow: 0 0 0 2px var(--sysu-green); }
        .select-arrow { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted); pointer-events: none; font-size: 12px; }
        .tags-container { display: flex; flex-wrap: wrap; gap: 8px; }
        .tag-btn { padding: 10px 16px; border-radius: 20px; font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.25s ease; background: var(--bg-paper); color: var(--text-secondary); border: 1px solid var(--border-soft); }
        .tag-btn:hover { border-color: var(--sysu-green); }
        .tag-btn.selected { background: var(--sysu-green); color: white; border-color: var(--sysu-green); font-weight: 600; }
        .tag-btn.quick-btn { background: #fff3e0; border-color: #ff9800; color: #e65100; font-size: 12px; padding: 6px 12px; }
        .tag-btn.quick-btn.selected { background: #ff9800; border-color: #e65100; color: white; }
        .textarea-field { width: 100%; padding: 16px; font-size: 15px; font-family: 'Noto Sans SC', sans-serif; border: 1px solid var(--border-soft); border-radius: 16px; background: var(--bg-paper); color: var(--text-primary); outline: none; transition: all 0.2s ease; resize: vertical; min-height: 100px; line-height: 1.6; }
        .textarea-field:focus { border-color: var(--sysu-green); background: var(--bg-paper-light); }
        .textarea-field::placeholder { color: var(--text-muted); }
        .page-hint { text-align: center; padding: 16px; color: var(--text-muted); font-size: 13px; line-height: 1.6; background: linear-gradient(135deg, rgba(0,88,38,0.03) 0%, rgba(0,88,38,0.01) 100%); border-radius: 12px; margin-top: 8px; }
        .page-hint-icon { color: var(--sysu-green); margin-right: 4px; }
        .bottom-bar { position: fixed; bottom: 0; left: 0; right: 0; padding: 16px 20px 24px; background: linear-gradient(to top, var(--bg-paper) 80%, transparent); z-index: 100; }
        .bottom-btn-wrapper { max-width: 480px; margin: 0 auto; display: flex; gap: 12px; }
        .prev-btn { padding: 18px 24px; background: var(--card-white); color: var(--text-secondary); border: 1px solid var(--border-soft); border-radius: 24px; font-size: 16px; font-weight: 500; cursor: pointer; transition: all 0.3s ease; display: flex; align-items: center; gap: 6px; }
        .prev-btn:hover { border-color: var(--sysu-green); color: var(--sysu-green); }
        .next-btn { flex: 1; padding: 18px 0; background: var(--sysu-green); color: white; border: none; border-radius: 24px; font-size: 17px; font-weight: 600; cursor: pointer; transition: all 0.3s ease; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 4px 20px rgba(0, 88, 26, 0.25); }
        .next-btn:hover { background: var(--sysu-green-light); transform: scale(1.02); }
        .next-btn:active { transform: scale(0.98); }
        .next-btn:disabled { background: var(--border-soft); color: var(--text-muted); cursor: not-allowed; transform: none; box-shadow: none; }
        .next-btn.submit-btn { background: linear-gradient(135deg, var(--sysu-green) 0%, var(--sysu-green-light) 100%); }
        .toast { position: fixed; top: 24px; left: 50%; transform: translateX(-50%) translateY(-20px); padding: 14px 28px; border-radius: 16px; background: var(--sysu-green); color: white; font-size: 15px; font-weight: 500; z-index: 200; opacity: 0; transition: all 0.3s ease; pointer-events: none; }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .toast.error { background: var(--sysu-red); }
        .success-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center; z-index: 300; }
        .success-modal.show { display: flex; }
        .success-content { background: var(--card-white); padding: 48px 36px; border-radius: 28px; text-align: center; max-width: 360px; box-shadow: 0 20px 60px rgba(0, 58, 26, 0.15); animation: modalIn 0.4s ease; }
        @keyframes modalIn { from { opacity: 0; transform: translateY(30px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
        .success-icon { width: 80px; height: 80px; margin: 0 auto 24px; background: var(--sysu-green); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 36px; }
        .success-title { font-family: 'Noto Serif SC', serif; font-size: 26px; color: var(--text-primary); margin-bottom: 12px; font-weight: 700; }
        .success-desc { color: var(--text-secondary); font-size: 15px; margin-bottom: 28px; line-height: 1.7; }
        .success-btn { display: inline-block; padding: 14px 36px; background: var(--sysu-green); color: white; border-radius: 20px; text-decoration: none; font-weight: 600; transition: all 0.3s ease; }
        .success-btn:hover { background: var(--sysu-green-light); }
        .step-content { display: none; }
        .step-content.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .upload-area { border: 2px dashed var(--border-soft); border-radius: 16px; padding: 32px 20px; text-align: center; cursor: pointer; transition: all 0.3s ease; background: var(--bg-paper); }
        .upload-area:hover { border-color: var(--sysu-green); background: var(--bg-paper-light); }
        .upload-icon { font-size: 36px; margin-bottom: 12px; }
        .upload-text { font-size: 15px; color: var(--text-secondary); font-weight: 500; margin-bottom: 8px; }
        .upload-hint { font-size: 12px; color: var(--text-muted); }
        .upload-preview { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 16px; }
        .preview-item { position: relative; width: 100px; height: 100px; border-radius: 12px; overflow: hidden; box-shadow: var(--shadow-soft); }
        .preview-item img { width: 100%; height: 100%; object-fit: cover; }
        .preview-remove { position: absolute; top: 4px; right: 4px; width: 24px; height: 24px; background: rgba(0, 0, 0, 0.6); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; cursor: pointer; transition: all 0.2s ease; }
        .preview-remove:hover { background: var(--sysu-red); }

        /* 校区选择样式 */
        .expect-school-list { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }
        .expect-school-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; background: #f8f9fa; border: 1px solid var(--border-soft); border-radius: 10px; }
        .expect-school-name { font-size: 14px; font-weight: 500; color: var(--text-primary); max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: default; }
        .expect-school-name:hover { white-space: normal; overflow: visible; max-width: none; }
        .expect-school-delete { cursor: pointer; color: #999; font-size: 18px; line-height: 1; padding: 2px 6px; border-radius: 50%; transition: all 0.2s; }
        .expect-school-delete:hover { color: #e53e3e; background: #fff5f5; }
        .expect-campus-group { margin-top: 8px; padding: 8px 0; border-top: 1px dashed var(--border-soft); }

        /* 性格滑块样式 */
        .personality-row {
            margin-bottom: 28px;
            border-bottom: 1px solid var(--border-soft);
            padding-bottom: 20px;
        }
        .personality-row:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        .personality-question { font-weight: 600; color: var(--text-primary); margin-bottom: 16px; font-size: 14px; }
        .personality-item { margin-bottom: 20px; }
        .personality-label {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 8px;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .no-preference-btn {
            background: var(--bg-paper);
            border: 1px solid var(--border-soft);
            border-radius: 16px;
            padding: 4px 12px;
            font-size: 11px;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .no-preference-btn:hover {
            border-color: var(--sysu-green);
            color: var(--sysu-green);
        }
        .no-preference-btn.active {
            background: var(--sysu-green);
            color: white;
            border-color: var(--sysu-green);
        }
        .slider-wrapper {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .slider-left { font-size: 13px; color: var(--text-secondary); min-width: 70px; text-align: left; }
        .slider-right { font-size: 13px; color: var(--text-secondary); min-width: 70px; text-align: right; }
        .slider-track {
            flex: 1;
            position: relative;
        }
        .slider-input {
            width: 100%;
            height: 6px;
            -webkit-appearance: none;
            background: var(--border-soft);
            border-radius: 3px;
            outline: none;
            margin: 0;
            padding: 0;
        }
        .slider-input.disabled {
            opacity: 0.4;
            pointer-events: none;
        }
        .slider-input::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--sysu-green);
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0, 88, 26, 0.3);
            border: none;
            margin-top: -6px;
        }
        .slider-marks {
            display: flex;
            justify-content: space-between;
            margin-top: 6px;
            padding: 0 4px;
            font-size: 11px;
            color: var(--text-muted);
        }
        .slider-mark {
            text-align: center;
            flex: 1;
        }
        .slider-mark.active { color: var(--sysu-green); font-weight: 600; }

        /* 兴趣选择器样式 */
        .interest-selector {
            background: var(--bg-paper);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
            border: 1px solid var(--border-soft);
        }
        .interest-selector-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }
        .interest-number {
            width: 28px;
            height: 28px;
            background: var(--sysu-green);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 600;
        }
        .interest-category {
            flex: 1;
            padding: 10px 16px;
            border: 1px solid var(--border-soft);
            border-radius: 24px;
            background: var(--card-white);
            font-size: 14px;
            color: var(--text-primary);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .interest-category .placeholder { color: var(--text-muted); }
        .interest-category .selected-value { color: var(--sysu-green); font-weight: 500; }
        .interest-category .arrow { color: var(--text-muted); font-size: 12px; }
        .category-tags-panel {
            display: none;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--border-soft);
        }
        .category-tags-panel.show { display: block; }
        .category-search {
            width: 100%;
            padding: 10px 14px;
            font-size: 14px;
            border: 1px solid var(--border-soft);
            border-radius: 24px;
            margin-bottom: 12px;
            outline: none;
        }
        .category-search:focus { border-color: var(--sysu-green); }
        .category-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            max-height: 200px;
            overflow-y: auto;
        }
        .category-tag {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            background: var(--card-white);
            border: 1px solid var(--border-soft);
            transition: all 0.2s;
        }
        .category-tag:hover { border-color: var(--sysu-green); }
        .category-tag.selected { background: var(--sysu-green); color: white; border-color: var(--sysu-green); }
        .interest-detail {
            margin-top: 16px;
            padding-top: 12px;
            border-top: 1px dashed var(--border-soft);
        }
        .detail-row { margin-bottom: 16px; }
        .detail-row:last-child { margin-bottom: 0; }
        .detail-label { font-size: 13px; color: var(--text-muted); margin-bottom: 8px; font-weight: 500; }
        .sub-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .sub-tag {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            background: var(--bg-paper);
            border: 1px solid var(--border-soft);
        }
        .sub-tag:hover { border-color: var(--sysu-green); }
        .sub-tag.selected { background: var(--sysu-green); color: white; border-color: var(--sysu-green); }
        .sub-search {
            width: 100%;
            padding: 8px 12px;
            font-size: 13px;
            border: 1px solid var(--border-soft);
            border-radius: 20px;
            margin-bottom: 8px;
            outline: none;
        }
        .sub-search:focus { border-color: var(--sysu-green); }
        .selected-sub-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 8px;
        }
        .selected-sub-tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            background: var(--sysu-green);
            color: white;
            border-radius: 16px;
            font-size: 12px;
        }
        .selected-sub-tag .remove {
            cursor: pointer;
            opacity: 0.8;
            font-size: 14px;
        }
        .selected-sub-tag .remove:hover { opacity: 1; }
        .sub-hint { font-size: 11px; color: var(--text-muted); margin-top: 6px; }
        .other-input {
            margin-top: 8px;
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .other-input input {
            flex: 1;
            padding: 8px 12px;
            font-size: 13px;
            border: 1px solid var(--border-soft);
            border-radius: 20px;
            background: var(--card-white);
            outline: none;
        }
        .other-input input:focus { border-color: var(--sysu-green); }
        .other-input button {
            padding: 8px 16px;
            background: var(--sysu-green);
            color: white;
            border: none;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
        }

        /* 联系方式模块 */
        .contact-add-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .contact-method-select { flex: 0 0 120px; padding: 12px 36px 12px 12px; font-size: 14px; font-family: 'Noto Sans SC', sans-serif; border: none; border-radius: 12px; background: var(--bg-paper); color: var(--text-primary); cursor: pointer; appearance: none; outline: none; transition: all 0.2s ease; }
        .contact-method-select:focus { background: var(--bg-paper-light); box-shadow: 0 0 0 2px var(--sysu-green); }
        .contact-value-input { flex: 1; min-width: 120px; padding: 12px 14px; font-size: 14px; font-family: 'Noto Sans SC', sans-serif; border: none; border-radius: 12px; background: var(--bg-paper); color: var(--text-primary); outline: none; transition: all 0.2s ease; }
        .contact-value-input:focus { background: var(--bg-paper-light); box-shadow: 0 0 0 2px var(--sysu-green); }
        .contact-value-input::placeholder { color: var(--text-muted); }
        .contact-add-btn { padding: 10px 20px; background: var(--sysu-green); color: white; border: none; border-radius: 12px; font-size: 14px; font-weight: 500; cursor: pointer; white-space: nowrap; }
        .contact-add-btn:hover { background: var(--sysu-green-light); }
        .contact-entry { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; margin: 8px 0; background: #f8f9fa; border: 1px solid var(--border-soft); border-radius: 10px; }
        .contact-entry-info { display: flex; align-items: center; gap: 8px; }
        .contact-entry-type { font-size: 13px; color: var(--sysu-green); font-weight: 600; min-width: 50px; }
        .contact-entry-value { font-size: 14px; color: var(--text-primary); }
        .contact-entry-delete { cursor: pointer; color: #999; font-size: 18px; line-height: 1; padding: 2px 6px; border-radius: 50%; transition: all 0.2s; }
        .contact-entry-delete:hover { color: #e53e3e; background: #fff5f5; }

        @media (max-width: 480px) {
            .container { padding: 16px; }
            .page-title { font-size: 24px; }
            .card { padding: 20px; border-radius: 16px; }
            .option-row { flex-direction: column; }
            .option-row .option-btn { min-width: 100%; }
            .bottom-btn-wrapper { flex-direction: column-reverse; }
            .preview-item { width: 80px; height: 80px; }
            .slider-left, .slider-right { min-width: 55px; font-size: 11px; }
            .contact-method-select { width: 100%; }
        }

        /* ========== 暗色模式 ========== */
        @media (prefers-color-scheme: dark) {
            body { background: #0f1a14; }
            .container { color: #e8f0eb; }
            .header { border-bottom-color: #2a4a3a; }
            .logo { color: #4ade80; }
            .back-link { color: #4ade80; }
            .back-link:hover { background: rgba(0, 133, 62, 0.1); }
            .page-title { color: #4ade80; }
            .step-indicator { color: #6a7a70; }
            .step-indicator .current { color: #4ade80; }
            .card { background: #1a2e24; box-shadow: 0 2px 8px rgba(0,0,0,0.3); }
            .card h2 { color: #4ade80; border-bottom-color: #2a4a3a; }
            .form-group label { color: #c8d8ce; }
            .form-group input, .form-group select, .form-group textarea {
                background: #0f1a14;

<script>
    const API_URL = "/api";

// 登录失效时跳转，并保留返回路径。
function requireLogin() {
    if(window.__loginRedirecting)return;
    window.__loginRedirecting=true;
    localStorage.removeItem('token');localStorage.removeItem('user');
    location.replace('/login?redirect='+encodeURIComponent(location.pathname.split('/').pop()||'/'));
}

    // ===== 全量 schema 驱动：结构/文案/选项全部来自后台（/admin/survey 深度交友问卷）=====
    let SCHEMA = window.DeepSchema;
    let TOTAL_STEPS = SCHEMA.steps.length;
    let currentStep = 1;
    let draftKey='friendSurveyData:unavailable';let formData = {};
    let draftSyncTimer=null, draftSyncBusy=false;
    let userAccount = null;
    let authToken = null;

    let SCHOOL_CAMPUSES = SCHEMA.schools;
    let INTEREST_CATEGORIES = SCHEMA.interests.categories;
    let INTEREST_SUBCATEGORIES = SCHEMA.interests.subcategories;
    let SKILL_LEVELS = SCHEMA.interests.skillLevels;
    let SKILL_LEVELS_WITH_NA = [...SKILL_LEVELS, '没要求'];
    let FREQ_OPTIONS_WITH_NA = SCHEMA.interests.freq;
    let FREQ_OPTIONS = FREQ_OPTIONS_WITH_NA.filter(v => v !== '没要求');
    let CONTACT_METHODS = SCHEMA.contacts.methods;
    let PHOTO_MAX = SCHEMA.photos.max;

    // 存储三个兴趣的数据
    let interestsData = [
        { category: '', subcategories: [], skillLevel: '', skillLevelExpect: [], frequency: '' },
        { category: '', subcategories: [], skillLevel: '', skillLevelExpect: [], frequency: '' },
        { category: '', subcategories: [], skillLevel: '', skillLevelExpect: [], frequency: '' }
    ];

    // 存储性格"无所谓"状态
    let personalityNoPreference = new Array(SCHEMA.personality.length).fill(false);

    const optOf = o => (typeof o === 'object' && o !== null ? o : { value: o, label: o });
    const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text !== undefined) n.textContent = text; return n; };

    function applySchema(s) {
        SCHEMA = s; TOTAL_STEPS = s.steps.length;
        SCHOOL_CAMPUSES = s.schools; INTEREST_CATEGORIES = s.interests.categories;
        INTEREST_SUBCATEGORIES = s.interests.subcategories;
        SKILL_LEVELS = s.interests.skillLevels; SKILL_LEVELS_WITH_NA = [...SKILL_LEVELS, '没要求'];
        FREQ_OPTIONS_WITH_NA = s.interests.freq; FREQ_OPTIONS = FREQ_OPTIONS_WITH_NA.filter(v => v !== '没要求');
        CONTACT_METHODS = s.contacts.methods; PHOTO_MAX = s.photos.max;
        personalityNoPreference = new Array(s.personality.length).fill(false);
        renderAll();
    }

    function renderAll() {
        SCHEMA.cards.forEach((cards, i) => {
            const step = document.getElementById('step' + (i + 1));
            if (!step) return;
            step.querySelector('.page-title').textContent = SCHEMA.steps[i];
            const box = step.querySelector('.cards'); box.textContent = '';
            cards.forEach(c => box.append(renderCard(c)));
        });
        for (let i = SCHEMA.cards.length + 1; i <= 12; i++) { const s = document.getElementById('step' + i); if (s) s.remove(); }
    }

    function renderCard(c) {
        const card = el('div', 'card');
        if (c.items.some(it => it.type === 'campus')) card.id = 'ownCampusCard';
        if (c.id === 'expectCampusCard' || c.items.some(it => it.type === 'expect-campus')) card.id = 'expectCampusCard';
        const label = el('div', 'card-label', c.label);
        if (c.required) label.append(el('span', 'required-mark', '*必填'));
        card.append(label);
        if (c.hint) card.append(el('p', 'input-hint', c.hint));
        c.items.forEach(it => {
            const node = renderItem(it);
            if (node) card.append(node);
        });
        if (c.items.some(it => it.type === 'campus')) card.style.display = 'none';
        return card;
    }

    function renderItem(it) {
        const type = it.type;
        if (type === 'options' || type === 'tags') {
            const wrap = el('div');
            if (it.label) {
                const lab = el('div', type === 'options' ? 'sub-label' : 'input-hint', it.label);
                if (type === 'tags') lab.style.marginTop = '12px';
                wrap.append(lab);
            }
            const box = el('div', type === 'options' ? 'option-group' : 'tags-container');
            if (type === 'tags') { box.dataset.multi = 'true'; if (it.key === 'expect_quick') { box.id = 'expectQuickTags'; } }
            else box.className = 'option-row';
            box.dataset.field = it.key;
            (it.options || []).forEach(o => {
                const { value, label: text } = optOf(o);
                const b = el('button', type === 'options' ? 'option-btn' : 'tag-btn', text);
                b.dataset.value = value;
                if (it.key === 'expect_quick') b.classList.add('quick-btn');
                box.append(b);
            });
            wrap.append(box);
            return wrap;
        }
        if (type === 'select' || type === 'major') {
            const wrap = el('div');
            if (it.label) wrap.append(el('label', 'sub-label', it.label));
            const sw = el('div', 'select-wrapper');
            const sel = el('select', 'select-field');
            sel.dataset.field = it.key;
            if (it.placeholder) sel.append(new Option(it.placeholder, ''));
            if (type === 'major') { sel.id = 'majorCategory'; }
            else if (it.key === 'school') sel.id = 'schoolSelect';
            if (type === 'select') {
                const list = it.fromSchools ? Object.keys(SCHOOL_CAMPUSES).map(v => ({ value: v, label: v }))
                    : it.groups ? Object.entries(it.groups).flatMap(([g, arr]) => arr.map(v => ({ group: g, ...optOf(v) })))
                    : (it.options || []).map(optOf);
                let curGroup = null, og = null;
                list.forEach(o => {
                    if (o.group && o.group !== curGroup) { curGroup = o.group; og = el('optgroup'); og.label = curGroup; sel.append(og); }
                    (og && o.group ? og : sel).append(new Option(o.label, o.value));
                });
            }
            sw.append(sel, el('span', 'select-arrow', '▼'));
            wrap.append(sw);
            if (it.hint) wrap.append(el('p', 'input-hint', it.hint));
            return wrap;
        }
        if (type === 'text') {
            const wrap = el('div');
            if (it.label) wrap.append(el('label', 'sub-label', it.label));
            const input = el('input', 'input-field');
            input.dataset.field = it.key;
            if (it.placeholder) input.placeholder = it.placeholder;
            if (it.max) input.maxLength = it.max;
            wrap.append(input);
            return wrap;
        }
        if (type === 'textarea') {
            const t = el('textarea', 'textarea-field');
            t.dataset.field = it.key;
            if (it.placeholder) t.placeholder = it.placeholder;
            return t;
        }
        if (type === 'campus') {
            const wrap = el('div');
            if (it.label) wrap.append(el('div', 'sub-label', it.label));
            const sw = el('div', 'select-wrapper');
            const sel = el('select', 'select-field'); sel.id = 'ownCampus';
            sel.append(new Option('选择校区', ''));
            sw.append(sel, el('span', 'select-arrow', '▼'));
            wrap.append(sw);
            return wrap;
        }
        if (type === 'expect-campus') {
            const wrap = el('div');
            const sw = el('div', 'select-wrapper');
            const sel = el('select', 'select-field'); sel.id = 'expectSchool';
            sel.append(new Option(it.label || '+ 添加校区偏好', ''));
            Object.keys(SCHOOL_CAMPUSES).forEach(s => sel.append(new Option(s, s)));
            sw.append(sel, el('span', 'select-arrow', '▼'));
            const esc = el('div'); esc.id = 'expectSchoolsContainer';
            wrap.append(sw, esc);
            return wrap;
        }
        if (type === 'personality') {
            const box = el('div');
            SCHEMA.personality.forEach((p, idx) => {
                const i = idx + 1;
                const row = el('div', 'personality-row'); row.dataset.q = i;
                row.append(el('div', 'personality-question', p.title));
                for (const side of ['self', 'expect']) {
                    const item = el('div', 'personality-item');
                    const lab = el('div', 'personality-label');
                    if (side === 'self') lab.textContent = p.self;
                    else {
                        lab.append(el('span', '', '希望对方'));
                        const nb = el('button', 'no-preference-btn', '无所谓'); nb.dataset.expect = i;
                        lab.append(nb);
                    }
                    const sw = el('div', 'slider-wrapper');
                    sw.append(el('span', 'slider-left', p.left));
                    const track = el('div', 'slider-track');
                    const input = el('input', 'slider-input'); input.type = 'range'; input.min = 1; input.max = 5; input.value = 3;
                    input.id = 'personality_' + side + '_' + i;
                    track.append(input); sw.append(track, el('span', 'slider-right', p.right));
                    const marks = el('div', 'slider-marks');
                    for (let v = 1; v <= 5; v++) { const m = el('span', 'slider-mark', v === 3 ? '3(中立)' : String(v)); m.dataset.val = v; marks.append(m); }
                    item.append(lab, sw, marks);
                    row.append(item);
                }
                box.append(row);
            });
            return box;
        }
        if (type === 'interests') { const d = el('div'); d.id = 'interestsContainer'; return d; }
        if (type === 'photos') {
            const box = el('div');
            const area = el('div', 'upload-area'); area.id = 'uploadArea';
            area.append(el('div', 'upload-icon', '📷'), el('div', 'upload-text', '点击上传1～' + PHOTO_MAX + '张照片'), el('div', 'upload-hint', SCHEMA.photos.hint || '支持 JPG、PNG 格式'));
            const file = el('input'); file.type = 'file'; file.id = 'photoInput'; file.accept = 'image/*'; file.multiple = true; file.style.display = 'none';
            area.append(file);
            const prev = el('div', 'upload-preview'); prev.id = 'photoPreview';
            box.append(area, prev);
            return box;
        }
        if (type === 'contacts') {
            const box = el('div');
            const row = el('div', 'contact-add-row');
            const sel = el('select', 'contact-method-select'); sel.id = 'contactMethodAdd';
            sel.append(new Option('选择方式', ''));
            CONTACT_METHODS.forEach(m => sel.append(new Option(m, m)));
            const input = el('input', 'contact-value-input'); input.id = 'contactValueAdd'; input.placeholder = '输入账号或邮箱';
            const btn = el('button', 'contact-add-btn', '添加'); btn.id = 'contactAddBtn'; btn.type = 'button';
            row.append(sel, input, btn);
            box.append(row);
            const entries = el('div'); entries.id = 'contactEntries';
            box.append(entries);
            return box;
        }
        // 未知字段类型兜底：渲染为文本输入，避免后台 schema 出现渲染器不认识的 type 时静默不显示。
        const wrap = el('div');
        if (it.label) wrap.append(el('label', 'sub-label', it.label));
        const input = el('input', 'input-field');
        input.dataset.field = it.key;
        if (it.placeholder) input.placeholder = it.placeholder;
        if (it.max) input.maxLength = it.max;
        wrap.append(input);
        if (it.hint) wrap.append(el('p', 'input-hint', it.hint));
        return wrap;
    }

    function checkAuth() {
        authToken = localStorage.getItem('token');
        if (!authToken) {
            requireLogin();
            return false;
        }
        const userStr = localStorage.getItem('user');
        if (userStr) userAccount = JSON.parse(userStr);
        return true;
    }

    function getAuthHeaders() {
        return authToken ? { 'Authorization': 'Bearer ' + authToken } : {};
    }

    function handleApiResponse(data) {
        if (data.code === 401) {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            requireLogin();
            return true;
        }
        return false;
    }

    function getSchoolFromEmail(email) {
        if (!email) return '';
        if (email.endsWith('sysu.edu.cn')) return '中山大学';
        if (email.endsWith('scut.edu.cn')) return '华南理工大学';
        if (email.endsWith('jnu.edu.cn')) return '暨南大学';
        if (email.endsWith('m.scnu.edu.cn')) return '华南师范大学';
        if (email.endsWith('stu.scau.edu.cn')) return '华南农业大学';
        if (email.endsWith('gzhmu.edu.cn')) return '广州医科大学';
        if (email.endsWith('gzucm.edu.cn')) return '广州中医药大学';
        if (email.endsWith('gdut.edu.cn')) return '广东工业大学';
        if (email.endsWith('oamail.gdufs.edu.cn')) return '广东外语外贸大学';
        if (email.endsWith('e.gzhu.edu.cn')) return '广州大学';
        if (email.endsWith('stu.gdpu.edu.cn')) return '广东药科大学';
        if (email.endsWith('xhcom.edu.cn')) return '星海音乐学院';
        if (email.endsWith('gzarts.edu.cn')) return '广州美术学院';
        return '';
    }

    const stepRequiredFields = {};
    function buildRequiredFields(){SCHEMA.cards.forEach((cards,i)=>{stepRequiredFields[i+1]=cards.flatMap(c=>c.items.filter(it=>it.required).map(it=>it.key));});}

    const surveyMetrics=window.createSurveyMetrics('deep',()=>authToken);
    function init() {
        for(const name of ['input','change'])document.addEventListener(name,e=>{if(e.target.closest('[data-field], .step-content, .question-card'))surveyMetrics.start();});
        document.addEventListener('click',e=>{if(e.target.closest('.option-btn, .tag-btn, .multi-select-tag'))surveyMetrics.start();});
        if (!checkAuth()) return;

        if (userAccount) {
            formData['user_id'] = userAccount.id || userAccount.user_id || '';
            formData['email'] = userAccount.email || '';
            formData['my_school'] = getSchoolFromEmail(userAccount.email);
            if (userAccount.nickname && !formData['nickname']) {
                formData['nickname'] = userAccount.nickname;
            }
        }

        initOptionButtons();
        initMultiSelectTags();
        const categorySelect=document.getElementById('majorCategory');
        for(const name of AcademicFields.categories)categorySelect.add(new Option(name,name));
        initSelectFields();
        initInputFields();
        initTextareaFields();
        initPhotoUpload();
        initSchoolCampusLogic();
        initPersonalitySliders();
        initPersonalityNoPreferenceBtns();
        initInterestsModule();
        initContactFields();
        restoreDraft();
        restoreFormData();
        updateStepUI();
    }

    function initOptionButtons() {
        document.querySelectorAll('.option-group, .option-row').forEach(group => {
            const field = group.dataset.field;
            group.querySelectorAll('.option-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    group.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');
                    formData[field] = btn.dataset.value;
                    saveData();
                });
            });
        });
    }

    function initMultiSelectTags() {
        document.querySelectorAll('.tags-container[data-multi="true"]').forEach(container => {
            const field = container.dataset.field;
            if (!field) return;
            container.querySelectorAll('.tag-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const isSelected = btn.classList.contains('selected');
                    if (btn.dataset.value === '不限') {
                        container.querySelectorAll('.tag-btn').forEach(b => b.classList.remove('selected'));
                        if (!isSelected) btn.classList.add('selected');
                    } else {
                        const unlimitedBtn = container.querySelector('.tag-btn[data-value="不限"]');
                        if (unlimitedBtn) unlimitedBtn.classList.remove('selected');
                        btn.classList.toggle('selected');
                    }
                    const selected = [...container.querySelectorAll('.tag-btn.selected')].map(b => b.dataset.value);
                    formData[field] = selected.length > 0 ? selected : null;
                    saveData();
                });
            });
        });
    }

    function initSelectFields() {
        document.querySelectorAll('.select-field').forEach(select => {
            select.addEventListener('change', () => {
                formData[select.dataset.field] = select.value;
                saveData();
            });
        });
    }

    function initInputFields() {
        document.querySelectorAll('.input-field').forEach(input => {
            input.addEventListener('input', () => {
                formData[input.dataset.field] = input.value;
                saveData();
            });
        });
    }

    function initTextareaFields() {
        document.querySelectorAll('.textarea-field').forEach(textarea => {
            textarea.addEventListener('input', () => {

    function initPhotoUpload() {
        const uploadArea = document.getElementById('uploadArea');
        const photoInput = document.getElementById('photoInput');
        const preview = document.getElementById('photoPreview');
        if (!formData['photos']) formData['photos'] = [];

        uploadArea?.addEventListener('click', () => photoInput?.click());
        photoInput?.addEventListener('change', () => handleFiles(photoInput.files));

        function handleFiles(files) {
            const maxPhotos = PHOTO_MAX;
            const currentCount = formData['photos'].length;
            Array.from(files).slice(0, maxPhotos - currentCount).forEach(file => {
                if (file.type.startsWith('image/')) {
                    const img = new Image();
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    img.onload = () => {
                        let width = img.width, height = img.height;
                        const maxWidth = 800;
                        if (width > maxWidth) { height = (height * maxWidth) / width; width = maxWidth; }
                        canvas.width = width; canvas.height = height;
                        ctx.drawImage(img, 0, 0, width, height);
                        const compressedData = canvas.toDataURL('image/jpeg', 0.7);
                        formData['photos'].push(compressedData);
                        saveData();
                        const item = document.createElement('div');
                        item.className = 'preview-item';
                        item.innerHTML = `<img src="${compressedData}" alt="照片"><div class="preview-remove">×</div>`;
                        preview.appendChild(item);
                        item.querySelector('.preview-remove').addEventListener('click', () => {
                            const idx = formData['photos'].indexOf(compressedData);
                            if (idx > -1) { formData['photos'].splice(idx, 1); saveData(); }
                            item.remove();
                        });
                    };
                    img.src = URL.createObjectURL(file);
                }
            });
        }

        if (formData['photos']?.length > 0) {
            formData['photos'].forEach(src => {
                const item = document.createElement('div');
                item.className = 'preview-item';
                item.innerHTML = `<img src="${src}" alt="照片"><div class="preview-remove">×</div>`;
                preview.appendChild(item);
                item.querySelector('.preview-remove').addEventListener('click', () => {
                    const idx = formData['photos'].indexOf(src);
                    if (idx > -1) { formData['photos'].splice(idx, 1); saveData(); }
                    item.remove();
                });
            });
        }
    }

    // 学校-校区联动逻辑
    function initSchoolCampusLogic() {
        const schoolSelect = document.getElementById('schoolSelect');
        const ownCampusCard = document.getElementById('ownCampusCard');
        const ownCampusSelect = document.getElementById('ownCampus');
        const expectSchoolDropdown = document.getElementById('expectSchool');
        const expectQuickTags = document.getElementById('expectQuickTags');
        const expectSchoolsContainer = document.getElementById('expectSchoolsContainer');

        let selectedSchools = formData.expect_schools || [];
        let schoolCampuses = formData.expect_school_campuses || {};
        let quickSelected = formData.expect_quick || null;

        // 自己的校区
        schoolSelect.addEventListener('change', () => {
            const school = schoolSelect.value;
            formData.school = school;
            formData.own_campus = '';
            ownCampusSelect.innerHTML = '<option value="">选择校区</option>';

            if (school && SCHOOL_CAMPUSES[school]) {
                ownCampusCard.style.display = 'block';
                const campuses = SCHOOL_CAMPUSES[school];
                campuses.forEach(c => {
                    const opt = document.createElement('option');
                    opt.value = c; opt.textContent = c;
                    ownCampusSelect.appendChild(opt);
                });
            } else {
                ownCampusCard.style.display = 'none';
            }
            saveData();
        });

        ownCampusSelect.addEventListener('change', () => {
            formData.own_campus = ownCampusSelect.value;
            saveData();
        });

        // 快捷标签
        function onQuickBtnClick(val) {
            if (quickSelected === val) {
                quickSelected = null;
                expectQuickTags.querySelectorAll('.quick-btn').forEach(b => b.classList.remove('selected'));
            } else {
                quickSelected = val;
                expectQuickTags.querySelectorAll('.quick-btn').forEach(b => {
                    b.classList.toggle('selected', b.dataset.value === val);
                });
            }
            saveFormData();
            saveData();
        }

        expectQuickTags.querySelectorAll('.quick-btn').forEach(btn => {
            btn.addEventListener('click', () => onQuickBtnClick(btn.dataset.value));
        });

        // 添加学校
        expectSchoolDropdown.addEventListener('change', () => {
            const school = expectSchoolDropdown.value;
            if (!school) return;
            if (selectedSchools.includes(school)) {
                showToast('已添加该学校', true);
                expectSchoolDropdown.value = '';
                return;
            }
            selectedSchools.push(school);
            schoolCampuses[school] = [];
            expectSchoolDropdown.value = '';
            renderExpectSchools();
            saveFormData();
            saveData();
        });

        function removeSchool(school) {
            selectedSchools = selectedSchools.filter(s => s !== school);
            delete schoolCampuses[school];
            renderExpectSchools();
            saveFormData();
            saveData();
        }

        function toggleCampus(school, campus, isSelected) {
            if (!schoolCampuses[school]) schoolCampuses[school] = [];
            if (isSelected) {
                if (!schoolCampuses[school].includes(campus)) {
                    schoolCampuses[school].push(campus);
                }
            } else {
                schoolCampuses[school] = schoolCampuses[school].filter(c => c !== campus);
            }
            saveFormData();
            saveData();
        }

        function renderExpectSchools() {
            expectSchoolsContainer.innerHTML = '';
            if (selectedSchools.length === 0) return;

            const list = document.createElement('div');
            list.className = 'expect-school-list';

            selectedSchools.forEach(school => {
                const item = document.createElement('div');
                item.className = 'expect-school-item';

                const name = document.createElement('span');
                name.className = 'expect-school-name';
                name.textContent = school;
                name.title = school;

                const del = document.createElement('span');
                del.className = 'expect-school-delete';
                del.textContent = '×';
                del.addEventListener('click', () => removeSchool(school));

                item.appendChild(name);
                item.appendChild(del);
                list.appendChild(item);

                const group = document.createElement('div');
                group.className = 'expect-campus-group';
                const tagsContainer = document.createElement('div');
                tagsContainer.className = 'tags-container';
                tagsContainer.style.marginBottom = '4px';

                const campuses = SCHOOL_CAMPUSES[school] || [];
                campuses.forEach(campus => {
                    const btn = document.createElement('button');
                    btn.className = 'tag-btn';
                    btn.dataset.value = campus;
                    btn.textContent = campus;
                    btn.addEventListener('click', () => {
                        btn.classList.toggle('selected');
                        toggleCampus(school, campus, btn.classList.contains('selected'));
                    });
                    if (schoolCampuses[school] && schoolCampuses[school].includes(campus)) {
                        btn.classList.add('selected');
                    }
                    tagsContainer.appendChild(btn);
                });

                group.appendChild(tagsContainer);
                list.appendChild(group);
            });

            expectSchoolsContainer.appendChild(list);
        }

        function saveFormData() {
            formData.expect_quick = quickSelected;
            formData.expect_schools = selectedSchools;
            formData.expect_school_campuses = schoolCampuses;
            let allCampuses = [];
            if (quickSelected) allCampuses.push(quickSelected);
            Object.values(schoolCampuses).forEach(campusList => {
                allCampuses = allCampuses.concat(campusList);
            });
            formData.expect_campus = allCampuses;
        }

        renderExpectSchools();
    }

    function updateSliderMarks(slider) {
        const value = parseInt(slider.value);
        const marks = slider.parentElement.parentElement.querySelectorAll('.slider-mark');
        marks.forEach(mark => {
            if (parseInt(mark.dataset.val) === value) {
                mark.classList.add('active');
            } else {
                mark.classList.remove('active');
            }
        });

        const entriesContainer = document.getElementById('contactEntries');
        if (entriesContainer) entriesContainer.dataset.field = 'contact_entries';

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function renderEntries() {
            entriesContainer.innerHTML = '';
            contactEntries.forEach((entry, idx) => {
                const div = document.createElement('div');
                div.className = 'contact-entry';
                div.innerHTML = `<div class="contact-entry-info"><span class="contact-entry-type">${escapeHtml(entry.method)}</span><span class="contact-entry-value">${escapeHtml(entry.value)}</span></div><span class="contact-entry-delete" data-idx="${idx}">×</span>`;

            });
            entriesContainer.querySelectorAll('.contact-entry-delete').forEach(btn => {
                btn.addEventListener('click', () => {
                    const i = parseInt(btn.dataset.idx);
                    contactEntries.splice(i, 1);
                    formData.contact_entries = contactEntries;
                    renderEntries();
                    saveData();
                });
            });
        }

        if (addBtn) {
            addBtn.addEventListener('click', () => {
                const method = methodSelect?.value;
                const value = valueInput?.value?.trim();
                if (!method) { showToast('请选择联系方式类型', true); return; }
                if (!value) { showToast('请输入联系方式', true); return; }
                if (contactEntries.some(e => e.method === method)) {
                    showToast('该类型已存在，可删除后重新添加', true);
                    return;
                }
                contactEntries.push({ method, value });
                formData.contact_entries = contactEntries;
                methodSelect.value = '';
                valueInput.value = '';
                renderEntries();
                saveData();
            });
        }

        renderEntries();
    }

    function saveData() {
        formData.interests = interestsData.filter(i => i.category);
        localStorage.setItem(draftKey, JSON.stringify(formData));
        if (!draftKey.includes('unavailable')) { try { localStorage.setItem(draftKey + ':ts', String(Date.now())); } catch (e) {} }
        scheduleDraftSync();
    }
    // 草稿多设备同步：防抖 2s 推到服务端，失败静默（localStorage 兜底仍在）
    function scheduleDraftSync() { clearTimeout(draftSyncTimer); draftSyncTimer = setTimeout(syncDraftServer, 2000); }
    async function syncDraftServer() {
        if (draftKey.includes('unavailable') || !authToken || draftSyncBusy) return;
        draftSyncBusy = true;
        try {
            await fetch(API_URL + '/account/deep-draft', { method: 'PUT', headers: { 'Content-Type': 'application/json', ...getAuthHeaders() }, body: JSON.stringify({ data: formData }) });
        } catch (e) {}
        draftSyncBusy = false;
    }

    function restoreDraft() {
        const draft = formData;
        if (Object.keys(draft).length === 0) return;
        document.querySelectorAll('.input-field').forEach(input => {
            const field = input.dataset.field;
            if (draft[field] !== undefined) input.value = draft[field];
        });
        document.querySelectorAll('.textarea-field').forEach(textarea => {
            const field = textarea.dataset.field;
            if (draft[field] !== undefined) textarea.value = draft[field];
        });
        document.querySelectorAll('.select-field').forEach(select => {
            const field = select.dataset.field;
            if (draft[field] !== undefined) select.value = draft[field];
        });
    }

    function restoreFormData() {
        document.querySelectorAll('.option-group, .option-row').forEach(group => {
            const field = group.dataset.field;
            if (formData[field]) {
                group.querySelectorAll('.option-btn').forEach(btn => {
                    if (btn.dataset.value === formData[field]) btn.classList.add('selected');
                });
            }
        });
        document.querySelectorAll('.tags-container').forEach(container => {
            const field = container.dataset.field;
            if (formData[field] && Array.isArray(formData[field])) {
                container.querySelectorAll('.tag-btn').forEach(btn => {
                    if (formData[field].includes(btn.dataset.value)) btn.classList.add('selected');
                });
            }
        });
    }

    function updateStepUI() {
        const displayStep = currentStep;
        document.getElementById('stepText').textContent = `STEP ${String(displayStep).padStart(2, '0')} / ${String(TOTAL_STEPS).padStart(2, '0')}`;
        document.getElementById('progressFill').style.width = `${(currentStep / TOTAL_STEPS) * 100}%`;
        document.querySelectorAll('.step-content').forEach(content => content.classList.remove('active'));
        document.getElementById(`step${currentStep}`).classList.add('active');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        prevBtn.style.display = currentStep > 1 ? 'flex' : 'none';
        if (currentStep === TOTAL_STEPS) {
            nextBtn.innerHTML = '<span>提交问卷</span><span>✓</span>';
            nextBtn.classList.add('submit-btn');
        } else {
            nextBtn.innerHTML = '<span>下一页</span><span>→</span>';
            nextBtn.classList.remove('submit-btn');
        }
    }

    // 找到某个字段的题面文案，用于把"请填写所有必填项"变成具体的"还差哪一题"。
    function fieldLabelOf(field) {
        const items = (SCHEMA.cards[currentStep - 1] || []).flatMap(c => c.items || []);
        const hit = items.find(it => it.key === field);
        return (hit && (hit.label || hit.placeholder)) || field;
    }

    // 把用户带到缺失的那一题：滚动过去、高亮、并聚焦第一个可填控件。
    function revealField(field) {
        const nodes = [...document.querySelectorAll('[data-field]')];
        const node = nodes.find(n => n.dataset.field === field);
        if (!node) return;
        const card = node.closest('.card') || node;
        card.scrollIntoView({ behavior: 'smooth', block: 'center' });
        card.classList.add('field-missing');
        setTimeout(() => card.classList.remove('field-missing'), 2800);
        const target = card.querySelector('input:not([type=hidden]), select, textarea, button.option, button.tag');
        if (target && typeof target.focus === 'function') target.focus({ preventScroll: true });
    }

    function validateCurrentStep() {
        const required = [...(stepRequiredFields[currentStep] || [])];
        for (const field of required) {
            const value = formData[field];
            if (!value || (Array.isArray(value) && value.length === 0) || (typeof value === 'string' && !value.trim())) {
                showToast('还差一题：「' + fieldLabelOf(field) + '」，已为你定位到该题。', true);
                revealField(field);
                return false;
            }
        }
        if (currentStep === TOTAL_STEPS) {
            const entries = formData.contact_entries || [];
            if (entries.length === 0) {
                showToast('请至少添加一种联系方式，已为你定位到该题。', true);
                revealField('contact_entries');
                return false;
            }
        }
        return true;
    }

    function showToast(msg, isError = false) {
        const toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.className = isError ? 'toast show error' : 'toast show';
        setTimeout(() => toast.classList.remove('show'), 3000);
    }

    document.getElementById('prevBtn').addEventListener('click', () => {
        if (currentStep > 1) { currentStep--; updateStepUI(); }
    });

    document.getElementById('nextBtn').addEventListener('click', async () => {
        if (!validateCurrentStep()) return;
        if (currentStep === TOTAL_STEPS) {
            const btn = document.getElementById('nextBtn');
            btn.disabled = true;
            btn.innerHTML = '<span>提交中...</span>';
            try {
                if (userAccount) {
                    formData['user_id'] = userAccount.id || userAccount.user_id || '';
                    formData['email'] = userAccount.email || '';
                    formData['my_school'] = getSchoolFromEmail(userAccount.email);
                }

                for(let i=1;i<=SCHEMA.personality.length;i++){formData['personality_self_'+i]=Number(document.getElementById('personality_self_'+i).value);formData['personality_expect_'+i]=Number(document.getElementById('personality_expect_'+i).value);formData['personality_expect_'+i+'_no_pref']=personalityNoPreference[i-1];}
                await surveyMetrics.start();
                const response = await fetch(API_URL+'/account/deep-survey', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', ...getAuthHeaders() },
                    body: JSON.stringify(formData)
                });
                const result = await response.json();
                if (handleApiResponse(result)) return;
                if (result.code === 200) {
                    localStorage.removeItem(draftKey);
                    try { localStorage.removeItem(draftKey + ':ts'); } catch (e) {}
                    clearTimeout(draftSyncTimer);
                    try { await fetch(API_URL + '/account/deep-draft', { method: 'DELETE', headers: getAuthHeaders() }); } catch (e) {}
                    document.getElementById('successModal').classList.add('show');
                } else {
                    showToast(result.msg || '提交失败，请重试', true);
                    btn.disabled = false;
                    btn.innerHTML = '<span>提交问卷</span><span>✓</span>';
                }
            } catch (error) {
                console.error('提交失败:', error);
                showToast('网络异常，请重试', true);
                btn.disabled = false;
                btn.innerHTML = '<span>提交问卷</span><span>✓</span>';
            }
        } else {
            currentStep++;
            updateStepUI();
        }
    });

    window.addEventListener('beforeunload', (e) => {
        if (Object.keys(formData).length > 0) { e.preventDefault(); e.returnValue = ''; }
    });

    async function boot(){if(!checkAuth())return;try{const so=await fetch(API_URL+'/survey-schema/deep').then(r=>r.json());if(so.code===200&&so.schema&&Array.isArray(so.schema.steps)&&so.schema.steps.length)applySchema(so.schema);}catch(e){}buildRequiredFields();try{const me=await fetch(API_URL+'/account/me',{headers:getAuthHeaders()});const account=await me.json();if(handleApiResponse(account))return;if(account.code!==200)throw Error('登录信息读取失败');userAccount=account.user;const id=userAccount.id||userAccount.account_id;if(!id)throw Error('账号信息不完整');draftKey='friendSurveyData:'+id;const r=await fetch(API_URL+'/account/deep-survey',{headers:getAuthHeaders()});const saved=await r.json();if(handleApiResponse(saved))return;if(saved.code!==200)throw Error(saved.msg||'问卷读取失败');formData={...saved.prefill,...Object.fromEntries(Object.entries(saved.data||{}).filter(([,v])=>v!=null&&v!==''))};
let draftData=null,draftTs=0;const draft=localStorage.getItem(draftKey);
if(draft){try{draftData=JSON.parse(draft);draftTs=Number(localStorage.getItem(draftKey+':ts'))||0;}catch(e){draftData=null;}}
try{const dr=await fetch(API_URL+'/account/deep-draft',{headers:getAuthHeaders()}).then(r=>r.json());
 if(dr.code===200&&dr.draft&&dr.draft.data&&typeof dr.draft.data==='object'){const st=dr.draft.updated_at?new Date(dr.draft.updated_at).getTime():0;
  if(st>=draftTs){draftData=dr.draft.data;try{localStorage.setItem(draftKey,JSON.stringify(draftData));localStorage.setItem(draftKey+':ts',String(st));}catch(e){}}}}catch(e){}
if(draftData)formData={...formData,...draftData};const campusAliases={"广州海珠南校": "广州南校园", "广州越秀北校": "广州北校园", "广州天河东校": "广州东校园"};formData.school=AcademicFields.school;formData.own_campus=campusAliases[formData.own_campus]||formData.own_campus;for(const name of Object.keys(formData.expect_school_campuses||{}))formData.expect_school_campuses[name]=formData.expect_school_campuses[name].map(x=>campusAliases[x]||x);init();if(formData.school){document.getElementById('ownCampusCard').style.display='block';const select=document.getElementById('ownCampus');if(select)select.innerHTML='<option value="">选择校区</option>'+(SCHOOL_CAMPUSES[formData.school]||[]).map(c=>'<option '+(c===formData.own_campus?'selected':'')+'>'+c+'</option>').join('');}if(saved.needs_resave)showToast('请确认并保存完整问卷后，再开启每周深度交友');}catch(e){showToast(e.message,true);}}
    boot();

</script>
